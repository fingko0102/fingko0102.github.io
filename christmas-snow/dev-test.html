<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>❄️ 10만 개의 크리스마스 눈</title>
<meta name="description" content="10만 개의 눈 입자로 그린 인터랙티브 크리스마스 아트. 손가락 개수로 트리·눈사람·사슴·선물·눈결정·산타 썰매가 나타납니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#eaf2ff;
    --muted:#9db0cd;
    --glass:rgba(16,26,46,.62);
    --line:rgba(150,190,255,.17);
    --gold:rgba(255,208,130,.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#03050c;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(120% 78% at 50% 6%, rgba(46,88,158,.60) 0%, rgba(12,22,44,.72) 40%, rgba(3,5,12,1) 80%),
      radial-gradient(55% 45% at 82% 102%, rgba(24,104,136,.22), transparent 70%),
      radial-gradient(50% 40% at 14% 92%, rgba(96,60,140,.16), transparent 72%);
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

  header{
    position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;
    padding:calc(11px + env(safe-area-inset-top)) 12px 20px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:linear-gradient(to bottom, rgba(3,5,12,.78) 0%, rgba(3,5,12,.35) 55%, transparent 100%);
  }
  h1{
    margin:0;font-size:clamp(14px,4.1vw,22px);font-weight:750;letter-spacing:.01em;
    text-align:center;text-shadow:0 0 26px rgba(150,195,255,.55),0 1px 2px rgba(0,0,0,.6);
  }
  .badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:100%}
  .badge{
    font-size:11px;line-height:1;padding:6px 10px;border-radius:999px;
    background:rgba(18,30,54,.66);border:1px solid var(--line);color:var(--muted);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:color .25s,border-color .25s,box-shadow .25s;
    white-space:nowrap;
  }
  .badge.on{color:#eef7ff;border-color:rgba(140,200,255,.5);box-shadow:0 0 18px rgba(90,160,255,.35),inset 0 0 12px rgba(90,160,255,.18)}
  .badge.gold.on{color:#fff5df;border-color:rgba(255,205,130,.55);box-shadow:0 0 18px rgba(255,180,90,.32),inset 0 0 12px rgba(255,190,110,.16)}

  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:4;
    padding:24px 8px calc(9px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;align-items:center;
    background:linear-gradient(to top, rgba(3,5,12,.9) 0%, rgba(3,5,12,.42) 62%, transparent 100%);
  }
  .chips{
    display:flex;gap:6px;width:100%;overflow-x:auto;overflow-y:hidden;
    padding:2px 6px 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    touch-action:pan-x;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font:inherit;font-size:clamp(11px,3.1vw,12.5px);font-weight:650;color:var(--ink);
    padding:9px 12px;border-radius:12px;border:1px solid var(--line);
    background:rgba(18,30,54,.62);cursor:pointer;white-space:nowrap;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .14s ease,background .2s,border-color .2s,box-shadow .25s;
  }
  .chip:active{transform:scale(.95)}
  .chip.active{
    border-color:rgba(255,214,140,.6);background:rgba(92,66,26,.72);color:#fff6e3;
    box-shadow:0 0 0 1px rgba(255,205,130,.25),0 0 22px rgba(255,175,80,.34);
  }
  .row{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap}
  button{
    font:inherit;font-size:clamp(11px,3.2vw,13px);font-weight:650;color:var(--ink);
    padding:10px 13px;border-radius:13px;border:1px solid var(--line);
    background:rgba(18,30,54,.64);cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:transform .14s ease,background .2s,border-color .2s,box-shadow .25s;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  button:hover{background:rgba(30,48,80,.76)}
  button:active{transform:scale(.955)}
  button.active{
    border-color:rgba(140,200,255,.55);
    background:rgba(32,64,116,.76);
    box-shadow:0 0 0 1px rgba(140,200,255,.22),0 0 24px rgba(80,150,255,.35);
  }
  button.warm.active{
    border-color:rgba(255,205,130,.55);
    background:rgba(94,68,26,.7);
    box-shadow:0 0 0 1px rgba(255,205,130,.25),0 0 24px rgba(255,175,80,.35);
  }

  #camwrap{
    position:fixed;right:10px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:2;
    width:132px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:#02040a;pointer-events:none;
    opacity:0;transform:translateY(10px) scale(.95);transition:opacity .3s,transform .3s;
    box-shadow:0 12px 34px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3);
  }
  #camwrap.show{opacity:1;transform:none}
  #cam{display:block;width:132px;height:99px;object-fit:cover;transform:scaleX(-1)}
  #handcanvas{position:absolute;inset:0;width:132px;height:99px}
  #camtag{
    position:absolute;left:5px;top:5px;font-size:9px;letter-spacing:.02em;
    padding:3px 6px;border-radius:999px;background:rgba(0,0,0,.5);color:#cfe4ff;
    backdrop-filter:blur(4px);
  }

  #cursor{
    position:fixed;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
    border:1.5px solid rgba(255,236,178,.95);z-index:4;pointer-events:none;opacity:0;
    transition:opacity .2s;
    box-shadow:0 0 20px rgba(255,214,120,.85),inset 0 0 14px rgba(255,230,170,.45);
  }
  #cursor::after{
    content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;
    background:#fff6dd;box-shadow:0 0 14px #ffdf8f;
  }
  #cursor.show{opacity:1}

  #hint{
    position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));z-index:2;
    transform:translateX(-50%);width:max-content;max-width:88vw;
    font-size:12px;line-height:1.5;color:#b9cbe6;text-align:center;
    padding:9px 14px;border-radius:12px;background:rgba(10,18,34,.62);border:1px solid var(--line);
    backdrop-filter:blur(8px);opacity:0;transition:opacity .6s;pointer-events:none;
  }
  #hint.show{opacity:1}

  #toast{
    position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));z-index:6;
    transform:translate(-50%,-8px);max-width:86vw;
    font-size:12.5px;line-height:1.45;color:#e9f2ff;text-align:center;
    padding:10px 15px;border-radius:13px;background:rgba(16,28,50,.9);border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #loading{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:15px;background:#04070f;
    transition:opacity .7s;color:#b9cbe6;font-size:12.5px;letter-spacing:.02em;
  }
  #loading.hide{opacity:0;pointer-events:none}
  .spinner{
    width:34px;height:34px;border-radius:50%;border:2px solid rgba(140,190,255,.18);
    border-top-color:#a3ccff;animation:spin 1.05s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .big{font-size:26px;filter:drop-shadow(0 0 16px rgba(160,200,255,.7))}
  #fatal{display:none;max-width:80vw;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <canvas id="scene" aria-label="10만 개의 눈 입자 아트"></canvas>

  <header>
    <h1>❄️ 10만 개의 크리스마스 눈</h1>
    <div class="badges">
      <span id="badgeMode" class="badge gold on">❄️ 눈보라</span>
      <span id="badgeGesture" class="badge">✋ 손을 보여 주세요</span>
      <span id="badgeCount" class="badge">✨ 100,000 입자</span>
    </div>
  </header>

  <div id="camwrap">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="handcanvas" width="264" height="198"></canvas>
    <span id="camtag">손 인식</span>
  </div>

  <div id="cursor"></div>
  <div id="hint">드래그하거나 손가락을 움직여 보세요 · 아래 칩으로 모양을 바로 바꿀 수 있어요</div>
  <div id="toast"></div>

  <footer>
    <div class="chips" id="chips">
      <button class="chip" type="button" data-mode="tree">🎄 트리</button>
      <button class="chip" type="button" data-mode="snowman">⛄ 눈사람</button>
      <button class="chip" type="button" data-mode="follow">✨ 손 따라가기</button>
      <button class="chip" type="button" data-mode="deer">🦌 사슴</button>
      <button class="chip" type="button" data-mode="gift">🎁 선물상자</button>
      <button class="chip" type="button" data-mode="flake">❄️ 눈결정</button>
      <button class="chip" type="button" data-mode="santa">🎅 메리크리스마스</button>
    </div>
    <div class="row">
      <button id="btnCam" type="button">📷 카메라 손 인식</button>
      <button id="btnSnow" type="button">❄️ 눈보라</button>
      <button id="btnMusic" type="button" class="warm">🔔 오르골 소리</button>
    </div>
  </footer>

  <div id="loading">
    <div class="big">❄️</div>
    <div class="spinner"></div>
    <div id="loadingText">100,000개의 눈을 만들고 있어요…</div>
    <div id="fatal"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
    }
  }
  </script>

  <script>
  // 실행 중 오류를 모아 두는 작은 기록(문제 진단용). 화면에는 나오지 않습니다.
  window.__snowErrors = [];
  window.addEventListener('error', function (e) {
    window.__snowErrors.push('error: ' + (e.message || 'unknown'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__snowErrors.push('rejection: ' + ((r && r.message) || String(r)));
  });
  (function () {
    var orig = console.error.bind(console);
    console.error = function () {
      try {
        window.__snowErrors.push('console: ' + Array.prototype.map.call(arguments, function (a) {
          return (a && a.message) || String(a);
        }).join(' ').slice(0, 240));
      } catch (err) {}
      orig.apply(null, arguments);
    };
  })();
  </script>

  <script type="module">
  import * as THREE from 'three';

  /* =========================================================
     10만 개의 크리스마스 눈 — Three.js + GLSL, MediaPipe Hand Landmarker
     · 손가락 0(주먹)=산타 썰매, 1=눈사람, 2=손 따라가기, 3=사슴,
       4=선물상자, 5=눈결정, 손이 보이면=트리
     · 모양 7종은 자바에서 좌표/색 배열로 미리 만들어 두고
       aFrom/aTo 두 쌍만 셰이더에 올려(어트리뷰트 16개 제한 안전) 모프한다.
     ========================================================= */

  const COUNT      = 100000;
  const MP_VERSION = '0.10.14';
  const MP_WASM    = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;
  const MP_BUNDLE  = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`;
  const MP_MODEL   = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

  const $ = (id) => document.getElementById(id);
  const canvas = $('scene');
  const video = $('cam');
  const handCanvas = $('handcanvas');
  const handCtx = handCanvas.getContext('2d');
  const cursorEl = $('cursor');
  const toastEl = $('toast');
  const hintEl = $('hint');
  const btnCam = $('btnCam');
  const btnSnow = $('btnSnow');
  const btnMusic = $('btnMusic');
  const badgeMode = $('badgeMode');
  const badgeGesture = $('badgeGesture');
  const badgeCount = $('badgeCount');
  const loadingEl = $('loading');
  const loadingText = $('loadingText');
  const fatalEl = $('fatal');
  const chipsEl = $('chips');

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const PI2 = Math.PI * 2;

  function toast(msg, ms = 2600) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  /* ---------- 결정론적 난수 ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20251225);

  /* 화면에 보이는 색 그대로 쓰기 위한 HSL→RGB (셰이더는 변환 없이 출력) */
  function hsl(h, s, l) {
    h = ((h % 1) + 1) % 1;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => {
      const k = (n + h * 12) % 12;
      return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    };
    return [f(0), f(8), f(4)];
  }

  /* =========================================================
     렌더러 · 카메라 · 씬
     ========================================================= */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas, antialias: false, alpha: true, depth: false, stencil: false,
      powerPreference: 'high-performance', preserveDrawingBuffer: true
    });
  } catch (err) {
    window.__snowErrors.push('webgl: ' + err.message);
    fatalEl.style.display = 'block';
    fatalEl.textContent = '이 브라우저에서는 WebGL을 쓸 수 없어요. 최신 Chrome·Safari·Edge에서 열어 주세요.';
    loadingText.textContent = 'WebGL을 시작하지 못했어요';
    document.querySelector('#loading .spinner').style.display = 'none';
    throw err;
  }
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);

  /* =========================================================
     버텍스 어트리뷰트 (aFrom/aTo 두 쌍만 사용)
     ========================================================= */
  const A = {
    fromPos: new Float32Array(COUNT * 3),
    fromCol: new Float32Array(COUNT * 3),
    toPos:   new Float32Array(COUNT * 3),
    toCol:   new Float32Array(COUNT * 3),
    snow:    new Float32Array(COUNT * 3),
    chaos:   new Float32Array(COUNT * 3),
    size:    new Float32Array(COUNT),
    phase:   new Float32Array(COUNT),
    speed:   new Float32Array(COUNT)
  };

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;
    A.snow[i3]     = rnd() * 2 - 1;
    A.snow[i3 + 1] = rnd() * 2 - 1;
    A.snow[i3 + 2] = rnd() * 2 - 1;
    const th = rnd() * PI2;
    const ph = Math.acos(rnd() * 2 - 1);
    const mag = 0.35 + rnd() * 1.15;
    A.chaos[i3]     = Math.sin(ph) * Math.cos(th) * mag;
    A.chaos[i3 + 1] = Math.cos(ph) * mag;
    A.chaos[i3 + 2] = Math.sin(ph) * Math.sin(th) * mag;
    A.size[i]  = 0.85 + rnd() * 1.25;
    A.phase[i] = rnd();
    A.speed[i] = 0.45 + rnd() * 1.25;
  }

  /* =========================================================
     모양 만들기 — 작은 부품 샘플러들
     ========================================================= */
  const LIGHT = [0.28, 0.62, 0.73];

  function tint(o, r, g, b, k) {
    o.r = Math.min(1, r * k);
    o.g = Math.min(1, g * k);
    o.b = Math.min(1, b * k);
  }

  // 구(속을 조금 채운 껍질): 입체감 있는 눈덩이·몸통
  function sph(cx, cy, cz, rx, ry, rz, rgb, opt = {}) {
    const shell = opt.shell === undefined ? 0.72 : opt.shell;
    const innerK = opt.innerK === undefined ? 0.55 : opt.innerK;
    const sh = opt.shade === undefined ? 0.40 : opt.shade;
    return (rng, o) => {
      const u = rng() * 2 - 1, th = rng() * PI2, s = Math.sqrt(1 - u * u);
      const nx = s * Math.cos(th), ny = u, nz = s * Math.sin(th);
      const k = rng() < shell ? (0.93 + rng() * 0.07) : Math.pow(rng(), 0.5) * innerK;
      o.x = cx + nx * rx * k; o.y = cy + ny * ry * k; o.z = cz + nz * rz * k;
      const nl = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
      tint(o, rgb[0], rgb[1], rgb[2], 1 - sh + sh * nl * 1.55);
    };
  }

  // 가는 막대(팔·다리·뿔의 한 마디)
  function limb(a, b, r0, r1, rgb, opt = {}) {
    const sh = opt.shade === undefined ? 0.38 : opt.shade;
    const ax = b[0] - a[0], ay = b[1] - a[1], az = b[2] - a[2];
    const len = Math.hypot(ax, ay, az) || 1e-6;
    const dx = ax / len, dy = ay / len, dz = az / len;
    let hx = 0, hy = 0, hz = 1;
    if (Math.abs(dz) > 0.85) { hx = 1; hz = 0; }
    let ux = dy * hz - dz * hy, uy = dz * hx - dx * hz, uz = dx * hy - dy * hx;
    const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
    const vx = dy * uz - dz * uy, vy = dz * ux - dx * uz, vz = dx * uy - dy * ux;
    return (rng, o) => {
      const t = rng();
      const rr = (r0 + (r1 - r0) * t) * (0.70 + 0.30 * Math.sqrt(rng()));
      const ang = rng() * PI2, ca = Math.cos(ang), sa = Math.sin(ang);
      const nx = ux * ca + vx * sa, ny = uy * ca + vy * sa, nz = uz * ca + vz * sa;
      o.x = a[0] + ax * t + nx * rr;
      o.y = a[1] + ay * t + ny * rr;
      o.z = a[2] + az * t + nz * rr;
      const nl = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
      tint(o, rgb[0], rgb[1], rgb[2], 1 - sh + sh * nl * 1.5);
    };
  }

  // 원기둥 (모자)
  function cyl(cx, cy, cz, r, h, rgb, opt = {}) {
    const capW = opt.cap === undefined ? 0.30 : opt.cap;
    const sh = opt.shade === undefined ? 0.38 : opt.shade;
    return (rng, o) => {
      if (rng() < capW) {
        const rr = r * Math.sqrt(rng()), a = rng() * PI2;
        o.x = cx + Math.cos(a) * rr;
        o.z = cz + Math.sin(a) * rr;
        o.y = cy + h / 2;
        tint(o, rgb[0], rgb[1], rgb[2], 1 - sh + sh * 1.25);
      } else {
        const a = rng() * PI2;
        o.x = cx + Math.cos(a) * r;
        o.y = cy + (rng() - 0.5) * h;
        o.z = cz + Math.sin(a) * r;
        const nl = Math.max(0, Math.cos(a) * LIGHT[0] + Math.sin(a) * LIGHT[2]);
        tint(o, rgb[0], rgb[1], rgb[2], 1 - sh + sh * nl * 1.6);
      }
    };
  }

  // 도넛(목도리·리본 고리·고삐 고리)
  function torus(cx, cy, cz, nx, ny, nz, R, tube, rgb, opt = {}) {
    const sh = opt.shade === undefined ? 0.34 : opt.shade;
    const R2 = opt.R2 === undefined ? R : opt.R2;
    const nl0 = Math.hypot(nx, ny, nz) || 1;
    nx /= nl0; ny /= nl0; nz /= nl0;
    let hx = 0, hy = 1, hz = 0;
    if (Math.abs(ny) > 0.85) { hx = 1; hy = 0; }
    let ux = ny * hz - nz * hy, uy = nz * hx - nx * hz, uz = nx * hy - ny * hx;
    const ul = Math.hypot(ux, uy, uz) || 1; ux /= ul; uy /= ul; uz /= ul;
    const vx = ny * uz - nz * uy, vy = nz * ux - nx * uz, vz = nx * uy - ny * ux;
    return (rng, o) => {
      const a = rng() * PI2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const rx = ux * ca * R + vx * sa * R2;
      const ry = uy * ca * R + vy * sa * R2;
      const rz = uz * ca * R + vz * sa * R2;
      const rl = Math.hypot(rx, ry, rz) || 1;
      const bx = rx / rl, by = ry / rl, bz = rz / rl;
      const rr = tube * (0.55 + 0.45 * Math.sqrt(rng()));
      const b2 = rng() * PI2;
      const o2x = bx * Math.cos(b2) + nx * Math.sin(b2);
      const o2y = by * Math.cos(b2) + ny * Math.sin(b2);
      const o2z = bz * Math.cos(b2) + nz * Math.sin(b2);
      o.x = cx + rx + o2x * rr;
      o.y = cy + ry + o2y * rr;
      o.z = cz + rz + o2z * rr;
      const nl = Math.max(0, o2x * LIGHT[0] + o2y * LIGHT[1] + o2z * LIGHT[2]);
      tint(o, rgb[0], rgb[1], rgb[2], 1 - sh + sh * nl * 1.5);
    };
  }

  // 평면 위의 원판(눈결정 중심·별 테두리)
  function disc(cx, cy, cz, r0, r1, rgb, opt = {}) {
    const thick = opt.thick === undefined ? 0.10 : opt.thick;
    return (rng, o) => {
      const rr = r0 + (r1 - r0) * Math.sqrt(rng());
      const a = rng() * PI2;
      o.x = cx + Math.cos(a) * rr;
      o.y = cy + Math.sin(a) * rr;
      o.z = cz + (rng() - 0.5) * thick;
      tint(o, rgb[0], rgb[1], rgb[2], 0.85 + rng() * 0.3);
    };
  }

  // 일정 영역(눈·코·입 자리)을 비워 두는 래퍼 — 점이 없어 배경이 보이며 눈·입이 된다
  function maskOut(inner, test) {
    return (rng, o) => {
      let tries = 0;
      do { inner(rng, o); tries++; } while (test(o) && tries < 7);
    };
  }

  /* ---------- 7개 모양 ---------- */

  // 1) 크리스마스 트리 + 나선 전구 + 꼭대기 별
  function buildTree() {
    const BASE_Y = -4.55, TREE_H = 8.0, TREE_R = 3.30;
    const parts = [];
    const ornament = [
      [1.00, 0.80, 0.32], [1.00, 0.80, 0.32], [1.00, 0.80, 0.32],
      [1.00, 0.34, 0.34], [1.00, 0.34, 0.34],
      [0.45, 0.80, 1.00], [1.00, 0.98, 0.90], [1.00, 0.56, 0.86]
    ];

    parts.push({ w: 0.90, fn: (rng, o) => {
      const hf = 1 - Math.pow(rng(), 0.5);
      const rMax = TREE_R * Math.pow(1 - hf, 1.0);
      const shell = (rng() < 0.58) ? 0.74 + 0.26 * Math.sqrt(rng()) : Math.pow(rng(), 0.5);
      const rad = rMax * shell;
      const th = (rng() < 0.32) ? hf * 12.0 + (rng() - 0.5) * 0.95 : rng() * PI2;
      o.x = Math.cos(th) * rad + (rng() - 0.5) * 0.10;
      o.z = Math.sin(th) * rad + (rng() - 0.5) * 0.10;
      o.y = BASE_Y + hf * TREE_H + (rng() - 0.5) * 0.08;
      if (rng() > 0.87) {
        const c = hsl(0.56, 0.22, 0.72 + rng() * 0.18);
        tint(o, c[0], c[1], c[2], 1);
      } else {
        const c = hsl(0.32 + rng() * 0.08, 0.55 + rng() * 0.28, 0.16 + rng() * 0.13);
        tint(o, c[0], c[1], c[2], 1);
      }
    }});

    parts.push({ w: 0.042, fn: (rng, o) => {
      const hf = Math.pow(rng(), 0.92);
      const th = hf * 12.0;
      const rad = TREE_R * Math.pow(1 - hf, 0.92) * 1.03;
      o.x = Math.cos(th) * rad + (rng() - 0.5) * 0.09;
      o.z = Math.sin(th) * rad + (rng() - 0.5) * 0.09;
      o.y = BASE_Y + hf * TREE_H;
      const c = ornament[(rng() * ornament.length) | 0];
      tint(o, c[0], c[1], c[2], 0.95 + rng() * 0.25);
    }});

    parts.push({ w: 0.034, fn: (rng, o) => {
      const k = rng() * 10;
      const seg = Math.floor(k), f = k - seg;
      const a0 = seg / 10 * PI2 - Math.PI / 2;
      const a1 = (seg + 1) / 10 * PI2 - Math.PI / 2;
      const RO = 1.28, RI = 0.50;
      const r0 = (seg % 2 === 0) ? RO : RI;
      const r1 = ((seg + 1) % 2 === 0) ? RO : RI;
      let sx = Math.cos(a0) * r0 + (Math.cos(a1) * r1 - Math.cos(a0) * r0) * f;
      let sy = Math.sin(a0) * r0 + (Math.sin(a1) * r1 - Math.sin(a0) * r0) * f;
      const shrink = Math.pow(rng(), 0.45);
      sx *= shrink; sy *= shrink;
      o.x = sx;
      o.y = BASE_Y + TREE_H + 0.95 + sy;
      o.z = (rng() - 0.5) * 0.30;
      if (rng() > 0.30) { const c = hsl(0.105 + rng() * 0.025, 0.85, 0.60 + rng() * 0.16); tint(o, c[0], c[1], c[2], 1); }
      else { const c = hsl(0.12, 0.25, 0.84 + rng() * 0.10); tint(o, c[0], c[1], c[2], 1); }
    }});

    parts.push({ w: 0.012, fn: (rng, o) => {
      const th = rng() * PI2;
      const rad = 0.10 + rng() * 0.14;
      o.x = Math.cos(th) * rad;
      o.z = Math.sin(th) * rad;
      o.y = BASE_Y - 0.35 + rng() * 0.62;
      const c = hsl(0.08, 0.45, 0.24 + rng() * 0.10);
      tint(o, c[0], c[1], c[2], 1);
    }});

    return buildShape(101, parts);
  }

  // 2) 눈사람 (모자·당근 코·목도리·팔까지)
  function buildSnowman() {
    const SHIFT = 0.62;
    const SNOW = [0.88, 0.93, 1.0];
    const parts = [];
    const S = (fn) => (rng, o) => { fn(rng, o); o.y += SHIFT; };

    // 얼굴·단추 자리는 점을 비워 둔다 (배경이 비쳐 눈·입이 또렷해짐)
    const mouthDots = [];
    for (let k = 0; k < 5; k++) {
      const a = (-0.62 + k * 0.31);
      mouthDots.push([Math.sin(a) * 0.33, 1.56 - Math.cos(a) * 0.07]);
    }
    const headMask = (o) => {
      if (o.z < 0.42) return false;
      if (Math.hypot(o.x - 0.29, o.y - 1.94) < 0.175) return true;
      if (Math.hypot(o.x + 0.29, o.y - 1.94) < 0.175) return true;
      if (Math.hypot(o.x, o.y - 1.80) < 0.18) return true;
      for (const [mx, my] of mouthDots) if (Math.hypot(o.x - mx, o.y - my) < 0.082) return true;
      return false;
    };
    const buttonMask = (o) => {
      if (o.z < 0.5) return false;
      if (Math.hypot(o.x, o.y - 0.24) < 0.135) return true;
      if (Math.hypot(o.x, o.y + 0.34) < 0.135) return true;
      if (Math.hypot(o.x, o.y + 0.88) < 0.135) return true;
      return false;
    };

    parts.push({ w: 0.150, fn: S(sph(0, -3.02, 0, 1.76, 1.72, 1.68, SNOW, { shade: 0.40 })) });
    parts.push({ w: 0.105, fn: S(maskOut(sph(0, -0.34, 0, 1.22, 1.18, 1.16, SNOW, { shade: 0.40 }), buttonMask)) });
    parts.push({ w: 0.082, fn: S(maskOut(sph(0, 1.78, 0, 0.92, 0.90, 0.88, SNOW, { shade: 0.40 }), headMask)) });

    // 눈 결정 반짝임
    parts.push({ w: 0.016, fn: S((rng, o) => {
      const u = rng() * 2 - 1, th = rng() * PI2, s = Math.sqrt(1 - u * u);
      const which = rng();
      const cy = which < 0.45 ? -3.02 : (which < 0.75 ? -0.34 : 1.78);
      const rr = which < 0.45 ? 1.78 : (which < 0.75 ? 1.23 : 0.93);
      o.x = s * Math.cos(th) * rr; o.y = cy + u * rr; o.z = s * Math.sin(th) * rr;
      tint(o, 1, 1, 1, 1.0 + rng() * 0.15);
    }) });

    // 눈·단추 (남겨 둔 자리에 은은한 숯빛)
    const COAL = [0.30, 0.34, 0.54];
    parts.push({ w: 0.005, fn: S(sph(-0.29, 1.94, 0.80, 0.115, 0.115, 0.10, COAL, { shade: 0.0 })) });
    parts.push({ w: 0.005, fn: S(sph(0.29, 1.94, 0.80, 0.115, 0.115, 0.10, COAL, { shade: 0.0 })) });
    for (let k = 0; k < 5; k++) {
      parts.push({ w: 0.0018, fn: S(sph(mouthDots[k][0], mouthDots[k][1], 0.80, 0.06, 0.06, 0.05, [0.26, 0.30, 0.50], { shade: 0.0 })) });
    }
    parts.push({ w: 0.0038, fn: S(sph(0, 0.24, 1.11, 0.10, 0.10, 0.085, COAL, { shade: 0.0 })) });
    parts.push({ w: 0.0038, fn: S(sph(0, -0.34, 1.15, 0.10, 0.10, 0.085, COAL, { shade: 0.0 })) });
    parts.push({ w: 0.0038, fn: S(sph(0, -0.88, 1.08, 0.10, 0.10, 0.085, COAL, { shade: 0.0 })) });

    // 당근 코 (비스듬히 앞으로)
    parts.push({ w: 0.016, fn: S(limb([0, 1.80, 0.72], [0.88, 1.52, 1.10], 0.20, 0.015, [1.0, 0.56, 0.14], { shade: 0.12 })) });

    // 목도리
    parts.push({ w: 0.020, fn: S(torus(0, 0.86, 0, 0, 1, 0, 1.02, 0.21, [0.94, 0.16, 0.24], { shade: 0.3 })) });
    parts.push({ w: 0.014, fn: S(limb([0.72, 0.90, 0.66], [0.56, -0.55, 0.96], 0.19, 0.15, [0.94, 0.16, 0.24], { shade: 0.3 })) });
    for (let k = 0; k < 5; k++) {
      parts.push({ w: 0.0016, fn: S(limb([0.56 + k * 0.055 - 0.11, -0.55, 0.96], [0.52 + k * 0.06 - 0.12, -0.80, 0.98], 0.035, 0.02, [0.98, 0.55, 0.30])) });
    }

    // 팔(나뭇가지)
    const WOOD = [0.70, 0.46, 0.26];
    parts.push({ w: 0.010, fn: S(limb([-1.06, -0.48, 0.0], [-2.32, 0.14, 0.06], 0.085, 0.045, WOOD)) });
    parts.push({ w: 0.006, fn: S(limb([-1.86, -0.06, 0.03], [-2.42, 0.62, 0.02], 0.045, 0.02, WOOD)) });
    parts.push({ w: 0.010, fn: S(limb([1.06, -0.48, 0.0], [2.32, 0.14, 0.06], 0.085, 0.045, WOOD)) });
    parts.push({ w: 0.006, fn: S(limb([1.86, -0.06, 0.03], [2.42, 0.62, 0.02], 0.045, 0.02, WOOD)) });

    // 모자
    const HAT = [0.24, 0.26, 0.44];
    parts.push({ w: 0.018, fn: S(cyl(0, 2.58, 0, 1.02, 0.13, [0.16, 0.18, 0.34], { cap: 0.55 })) });
    parts.push({ w: 0.038, fn: S(cyl(0, 3.14, 0, 0.58, 1.02, HAT, { cap: 0.35 })) });
    parts.push({ w: 0.010, fn: S(cyl(0, 2.80, 0, 0.595, 0.17, [0.92, 0.18, 0.26], { cap: 0.0 })) });

    return buildShape(202, parts);
  }

  // 3) 순록(사슴) — 빨간 코
  function buildDeer() {
    const FUR = [0.66, 0.40, 0.19];
    const FUR_D = [0.48, 0.28, 0.12];
    const BELLY = [0.80, 0.64, 0.46];
    const BONE = [0.86, 0.80, 0.68];
    const HOOF = [0.30, 0.22, 0.19];
    const parts = [];
    const DX = -0.50, DY = -0.62;
    const S = (fn) => (rng, o) => { fn(rng, o); o.x += DX; o.y += DY; };

    parts.push({ w: 0.115, fn: S(sph(0, 0.35, 0, 1.52, 0.78, 0.64, FUR, { shade: 0.42 })) });
    parts.push({ w: 0.050, fn: S(sph(-1.16, 0.40, 0, 0.76, 0.74, 0.62, FUR_D, { shade: 0.42 })) });
    parts.push({ w: 0.050, fn: S(sph(1.12, 0.42, 0, 0.70, 0.72, 0.60, FUR, { shade: 0.42 })) });
    parts.push({ w: 0.022, fn: S(sph(0.10, -0.12, 0, 1.30, 0.34, 0.46, BELLY, { shade: 0.30 })) });

    parts.push({ w: 0.045, fn: S(limb([1.42, 0.72, 0], [2.08, 1.82, 0], 0.46, 0.33, FUR, { shade: 0.38 })) });
    parts.push({ w: 0.038, fn: S(sph(2.28, 2.02, 0, 0.50, 0.40, 0.36, FUR, { shade: 0.40 })) });
    parts.push({ w: 0.020, fn: S(sph(2.70, 1.90, 0, 0.30, 0.21, 0.22, [0.80, 0.56, 0.32], { shade: 0.36 })) });

    // 빨간 코 (밝게, 고밀도)
    parts.push({ w: 0.016, fn: S((rng, o) => {
      const u = rng() * 2 - 1, th = rng() * PI2, s = Math.sqrt(1 - u * u);
      o.x = 2.95 + s * Math.cos(th) * 0.15;
      o.y = 1.90 + u * 0.15;
      o.z = s * Math.sin(th) * 0.15;
      tint(o, 1.0, 0.26, 0.18, 1);
    }) });
    parts.push({ w: 0.006, fn: S(sph(2.66, 1.98, 0.14, 0.045, 0.045, 0.045, [0.12, 0.10, 0.10], { shade: 0.0 })) });

    // 귀
    parts.push({ w: 0.010, fn: S(sph(2.10, 2.40, 0.26, 0.10, 0.17, 0.20, FUR_D, { shade: 0.3 })) });
    parts.push({ w: 0.010, fn: S(sph(2.10, 2.40, -0.26, 0.10, 0.17, 0.20, FUR_D, { shade: 0.3 })) });

    // 뿔 (양쪽)
    const antler = [
      [[2.14, 2.30, 0.18], [2.02, 2.92, 0.30], 0.075, 0.055],
      [[2.02, 2.92, 0.30], [1.80, 3.46, 0.36], 0.055, 0.030],
      [[2.06, 2.66, 0.27], [1.72, 2.86, 0.40], 0.050, 0.022],
      [[1.98, 3.02, 0.32], [1.58, 3.18, 0.44], 0.048, 0.020],
      [[1.86, 3.30, 0.35], [1.62, 3.62, 0.42], 0.045, 0.018],
      [[2.14, 2.44, 0.18], [2.42, 2.70, 0.24], 0.048, 0.020]
    ];
    for (const [a, b, r0, r1] of antler) {
      parts.push({ w: 0.008, fn: S(limb(a, b, r0, r1, BONE, { shade: 0.2 })) });
      parts.push({ w: 0.008, fn: S(limb([a[0], a[1], -a[2]], [b[0], b[1], -b[2]], r0, r1, BONE, { shade: 0.2 })) });
    }

    // 다리 4개 (도약 자세)
    const legs = [
      { p: [[1.10, -0.26, 0.44], [1.52, -1.42, 0.50], [1.70, -2.28, 0.48]], r: [0.21, 0.11] },
      { p: [[1.16, -0.26, -0.44], [1.28, -1.52, -0.52], [1.36, -2.36, -0.50]], r: [0.20, 0.10] },
      { p: [[-0.96, -0.24, 0.44], [-1.70, -1.28, 0.50], [-1.42, -2.22, 0.48]], r: [0.22, 0.11] },
      { p: [[-1.02, -0.24, -0.44], [-1.52, -1.44, -0.52], [-1.12, -2.30, -0.50]], r: [0.21, 0.10] }
    ];
    for (const L of legs) {
      parts.push({ w: 0.026, fn: S(limb(L.p[0], L.p[1], L.r[0], L.r[0] * 0.78, FUR, { shade: 0.34 })) });
      parts.push({ w: 0.020, fn: S(limb(L.p[1], L.p[2], L.r[0] * 0.72, L.r[1], FUR_D, { shade: 0.34 })) });
      parts.push({ w: 0.006, fn: S(sph(L.p[2][0], L.p[2][1] - 0.04, L.p[2][2], 0.12, 0.10, 0.11, HOOF, { shade: 0.2 })) });
    }

    // 꼬리
    parts.push({ w: 0.010, fn: S(sph(-1.92, 0.72, 0, 0.16, 0.22, 0.15, [0.94, 0.88, 0.76], { shade: 0.2 })) });

    // 목걸이 + 방울
    parts.push({ w: 0.008, fn: S(torus(1.60, 0.90, 0, 0.36, 0.92, 0, 0.46, 0.10, [0.90, 0.12, 0.20], { shade: 0.2 })) });
    parts.push({ w: 0.004, fn: S(sph(1.52, 0.52, 0.32, 0.10, 0.10, 0.10, [1.0, 0.82, 0.36], { shade: 0.15 })) });

    return buildShape(303, parts);
  }

  // 4) 리본 있는 선물 상자
  function buildGift() {
    const yaw = 33 * Math.PI / 180, pitch = 13 * Math.PI / 180;
    const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const T = (x, y, z) => {
      const X = x * cyw + z * syw;
      const Z1 = -x * syw + z * cyw;
      const Y = y * cp - Z1 * sp;
      const Z = y * sp + Z1 * cp;
      return [X, Y - 0.42, Z];
    };
    const H = 1.52;                       // 반지름
    const RED = [0.80, 0.14, 0.20];
    const GOLD = [1.0, 0.82, 0.42];
    const parts = [];

    // 여섯 면
    const faces = [
      { n: [0, 1, 0], k: 0.95 }, { n: [0, -1, 0], k: 0.42 },
      { n: [0, 0, 1], k: 0.94 }, { n: [0, 0, -1], k: 0.58 },
      { n: [1, 0, 0], k: 0.80 }, { n: [-1, 0, 0], k: 0.66 }
    ];
    for (const f of faces) {
      parts.push({ w: 0.095, fn: (rng, o) => {
        const u = rng() * 2 - 1, v = rng() * 2 - 1;
        let x, y, z;
        if (f.n[1] !== 0) { x = u * H; z = v * H; y = f.n[1] * H; }
        else if (f.n[2] !== 0) { x = u * H; y = v * H; z = f.n[2] * H; }
        else { z = u * H; y = v * H; x = f.n[0] * H; }
        const p = T(x, y, z);
        o.x = p[0]; o.y = p[1]; o.z = p[2];
        const k = f.k * (0.90 + rng() * 0.16);
        tint(o, RED[0], RED[1], RED[2], k);
      }});
    }

    // 리본 띠 (윗면 + 옆면 이어짐)
    const band = (faceN, axis) => {
      parts.push({ w: 0.020, fn: (rng, o) => {
        const u = rng() * 2 - 1, v = rng() * 2 - 1;
        const w = 0.255;
        let x, y, z;
        if (faceN[1] !== 0) {
          y = faceN[1] * (H + 0.012);
          if (axis === 'x') { x = (rng() - 0.5) * 2 * w; z = u * H; }
          else { z = (rng() - 0.5) * 2 * w; x = u * H; }
        } else if (faceN[2] !== 0) {
          z = faceN[2] * (H + 0.012);
          x = (rng() - 0.5) * 2 * w; y = v * H;
        } else {
          x = faceN[0] * (H + 0.012);
          z = (rng() - 0.5) * 2 * w; y = v * H;
        }
        const p = T(x, y, z);
        o.x = p[0]; o.y = p[1]; o.z = p[2];
        tint(o, GOLD[0], GOLD[1], GOLD[2], 0.86 + rng() * 0.22);
      }});
    };
    band([0, 1, 0], 'x'); band([0, 1, 0], 'z');
    band([0, 0, 1], 'x'); band([0, 0, -1], 'x');
    band([1, 0, 0], 'z'); band([-1, 0, 0], 'z');
    band([0, -1, 0], 'x'); band([0, -1, 0], 'z');

    // 위쪽 리본 매듭: 고리 두 개 + 가운데 매듭 + 꼬리
    const topY = H + 0.02;
    const loops = [
      { c: [0.58, topY + 0.24, 0], n: [0.22, 0.34, 0.91], R: 0.52, R2: 0.30, tube: 0.18 },
      { c: [-0.58, topY + 0.24, 0], n: [-0.22, 0.34, 0.91], R: 0.52, R2: 0.30, tube: 0.18 },
      { c: [0.0, topY + 0.20, 0.48], n: [0.92, 0.34, 0.20], R: 0.40, R2: 0.24, tube: 0.16 },
      { c: [0.0, topY + 0.20, -0.48], n: [0.92, 0.34, -0.20], R: 0.40, R2: 0.24, tube: 0.16 }
    ];
    for (const L of loops) {
      const c = T(L.c[0], L.c[1], L.c[2]);
      const nn = T(L.c[0] + L.n[0], L.c[1] + L.n[1], L.c[2] + L.n[2]);
      parts.push({ w: 0.024, fn: (rng, o) => {
        torus(c[0], c[1], c[2], nn[0] - c[0], nn[1] - c[1], nn[2] - c[2],
              L.R, L.tube, GOLD, { shade: 0.26, R2: L.R2 })(rng, o);
      }});
    }
    const knot = T(0, topY + 0.12, 0);
    parts.push({ w: 0.018, fn: (rng, o) => {
      sph(knot[0], knot[1], knot[2], 0.24, 0.21, 0.22, [1.0, 0.90, 0.60], { shade: 0.2 })(rng, o);
    }});
    for (const sgn of [1, -1]) {
      const a = T(sgn * 0.16, topY + 0.06, 0.0);
      const b = T(sgn * 0.98, topY - 0.42, 0.55);
      parts.push({ w: 0.011, fn: (rng, o) => {
        limb(a, b, 0.14, 0.06, GOLD, { shade: 0.25 })(rng, o);
      }});
    }

    return buildShape(404, parts);
  }

  // 5) 눈결정 (6각 대칭)
  function buildFlake() {
    const ICE = [0.80, 0.91, 1.0];
    const ICE_TIP = [0.98, 0.99, 1.0];
    const parts = [];

    parts.push({ w: 0.026, fn: sph(0, 0, 0, 0.26, 0.26, 0.15, ICE, { shade: 0.2 }) });
    parts.push({ w: 0.012, fn: disc(0, 0, 0, 0.30, 0.54, ICE, { thick: 0.14 }) });

    // 팔 하나: 각도 A, r0→r1, 폭 w0→w1
    function arm(angle, r0, r1, w0, w1, part, opt = {}) {
      const a = angle, ca = Math.cos(a), sa = Math.sin(a);
      const thick = opt.thick === undefined ? 0.09 : opt.thick;
      return (rng, o) => {
        const t = Math.pow(rng(), 0.85);
        const rr = r0 + (r1 - r0) * t;
        const ww = (w0 + (w1 - w0) * t);
        const off = (rng() * 2 - 1) * ww;
        o.x = ca * rr - sa * off;
        o.y = sa * rr + ca * off;
        o.z = (rng() - 0.5) * thick * (1 - 0.35 * t);
        tint(o, part[0], part[1], part[2], 0.82 + rng() * 0.32);
      };
    }

    const P = (ang, r) => [Math.cos(ang) * r, Math.sin(ang) * r, 0];

    for (let k = 0; k < 6; k++) {
      const base = k * Math.PI / 3;
      const ca = Math.cos(base), sa = Math.sin(base);
      parts.push({ w: 0.058, fn: arm(base, 0.30, 3.34, 0.095, 0.020, ICE) });

      // 깃털 같은 곁가지 — 팔 위의 점에서 양옆으로 뻗는다
      const br = [[0.85, 0.66, 0.055], [1.42, 0.58, 0.048], [1.96, 0.46, 0.038], [2.46, 0.34, 0.028]];
      for (const [r, len, wid] of br) {
        const A = [ca * r, sa * r, 0];
        for (const sgn of [1, -1]) {
          const a2 = base + sgn * 0.78;
          const B = [A[0] + Math.cos(a2) * len, A[1] + Math.sin(a2) * len, 0];
          parts.push({ w: 0.0095, fn: limb(A, B, wid, wid * 0.22, ICE, { shade: 0.10 }) });
          // 작은 잔가지
          const m = 0.55;
          const A2 = [A[0] + (B[0] - A[0]) * m, A[1] + (B[1] - A[1]) * m, 0];
          const a3 = base + sgn * 1.35;
          const B2 = [A2[0] + Math.cos(a3) * len * 0.38, A2[1] + Math.sin(a3) * len * 0.38, 0];
          parts.push({ w: 0.004, fn: limb(A2, B2, wid * 0.5, wid * 0.12, ICE, { shade: 0.10 }) });
        }
      }

      // 중심 육각 고리 — 이웃 팔을 잇는 가는 변
      parts.push({ w: 0.014, fn: limb(P(base, 0.62), P(base + Math.PI / 3, 0.62), 0.042, 0.042, ICE, { shade: 0.1 }) });

      // 끝 다이아몬드 (팔 방향으로 놓인 마름모)
      parts.push({ w: 0.011, fn: (rng, o) => {
        const t = rng() * 2 - 1;
        const rr = 3.32 + t * 0.26;
        const ww = (1 - Math.abs(t)) * 0.115 + 0.005;
        const off = (rng() * 2 - 1) * ww;
        o.x = ca * rr - sa * off;
        o.y = sa * rr + ca * off;
        o.z = (rng() - 0.5) * 0.05;
        tint(o, ICE_TIP[0], ICE_TIP[1], ICE_TIP[2], 0.95 + rng() * 0.22);
      }});
    }

    return buildShape(505, parts);
  }

  // 6) Merry Christmas + 산타 썰매 + 루돌프 (캔버스 2D 마스크를 샘플링)
  function buildSanta() {
    const W = 1400, H = 900;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    paintSantaArt(c, W, H);
    window.__snowArtCanvas = cv;

    const data = c.getImageData(0, 0, W, H).data;
    const list = [];
    for (let p = 0; p < W * H; p++) if (data[p * 4 + 3] > 40) list.push(p);
    const pos = new Float32Array(COUNT * 3);
    const col = new Float32Array(COUNT * 3);
    const scale = 9.0 / W;
    const rng = mulberry32(606);
    const n = Math.max(list.length, 1);
    for (let i = 0; i < COUNT; i++) {
      const p = list[(rng() * n) | 0];
      const px = p % W, py = (p / W) | 0;
      const i3 = i * 3;
      pos[i3]     = (px + rng() - 0.5 - W / 2) * scale;
      pos[i3 + 1] = (H / 2 - (py + rng() - 0.5)) * scale;
      pos[i3 + 2] = (rng() - 0.5) * 0.30;
      const k = 0.86 + rng() * 0.26;
      col[i3]     = Math.min(1, data[p * 4] / 255 * k);
      col[i3 + 1] = Math.min(1, data[p * 4 + 1] / 255 * k);
      col[i3 + 2] = Math.min(1, data[p * 4 + 2] / 255 * k);
    }
    return { pos, col };
  }

  /* ---------- 부품들을 COUNT 개로 채우기 ---------- */
  function buildShape(seed, parts) {
    const pos = new Float32Array(COUNT * 3);
    const col = new Float32Array(COUNT * 3);
    const rng = mulberry32(seed);
    const o = { x: 0, y: 0, z: 0, r: 1, g: 1, b: 1 };
    let total = 0;
    for (const p of parts) total += p.w;
    let i = 0;
    for (const p of parts) {
      let n = Math.round(COUNT * p.w / total);
      if (i + n > COUNT) n = COUNT - i;
      for (let k = 0; k < n; k++, i++) {
        p.fn(rng, o);
        const i3 = i * 3;
        pos[i3] = o.x; pos[i3 + 1] = o.y; pos[i3 + 2] = o.z;
        col[i3] = o.r; col[i3 + 1] = o.g; col[i3 + 2] = o.b;
      }
    }
    const last = parts[parts.length - 1];
    while (i < COUNT) {
      last.fn(rng, o);
      const i3 = i * 3;
      pos[i3] = o.x; pos[i3 + 1] = o.y; pos[i3 + 2] = o.z;
      col[i3] = o.r; col[i3 + 1] = o.g; col[i3 + 2] = o.b;
      i++;
    }
    return { pos, col };
  }

  /* =========================================================
     셰이더
     ========================================================= */
  const vertexShader = /* glsl */`
    attribute vec3  aFromPos;
    attribute vec3  aFromColor;
    attribute vec3  aToPos;
    attribute vec3  aToColor;
    attribute vec3  aSnow;
    attribute vec3  aChaos;
    attribute float aSize;
    attribute float aPhase;
    attribute float aSpeed;

    uniform float uTime;
    uniform float uMorph;
    uniform float uFromSnow;
    uniform float uToSnow;
    uniform float uZoom;
    uniform float uDPR;
    uniform float uSizeMul;
    uniform float uAlphaMul;
    uniform float uSpinY;
    uniform float uSpinZ;
    uniform float uFollow;
    uniform vec3  uBox;
    uniform vec3  uPointer;
    uniform float uPointerStrength;
    uniform float uPointerRadius;
    uniform vec3  uT0;
    uniform vec3  uT1;
    uniform vec3  uT2;
    uniform vec3  uT3;
    uniform vec4  uWave;

    varying vec3  vColor;
    varying float vGlow;
    varying float vAlpha;

    mat2 rot2(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

    void main(){
      float m  = uMorph;
      float me = m * m * (3.0 - 2.0 * m);

      /* ---- 눈: 시간에 따라 계속 내리고 바람에 흔들림 ---- */
      float fall = mod(aSnow.y - uTime * (0.030 + aSpeed * 0.048) + aPhase, 2.0) - 1.0;
      vec3 sp;
      sp.x = aSnow.x * uBox.x + sin(uTime * 0.52 + aPhase * 6.2831 + fall * 3.2) * (0.20 + 0.32 * aSpeed);
      sp.y = fall * uBox.y;
      sp.z = aSnow.z * uBox.z + cos(uTime * 0.44 + aPhase * 5.1) * 0.30;
      sp.x += sin(sp.y * 0.52 + uTime * 0.38) * 0.95;

      vec3 snowCol = mix(vec3(0.66, 0.80, 1.0), vec3(1.0), smoothstep(0.15, 0.85, fract(aPhase * 7.13)))
                   * (0.85 + 0.30 * fract(aPhase * 3.71));

      /* ---- aFrom ↔ aTo + 눈 상태 보간 ---- */
      vec3 P0 = mix(aFromPos, sp, uFromSnow);
      vec3 P1 = mix(aToPos,   sp, uToSnow);
      vec3 C0 = mix(aFromColor, snowCol, uFromSnow);
      vec3 C1 = mix(aToColor,   snowCol, uToSnow);

      vec3 pos = mix(P0, P1, me);
      vec3 col = mix(C0, C1, me);
      float shapeW = 1.0 - mix(uFromSnow, uToSnow, me);   // 0=눈, 1=모양

      /* ---- 모프 중 흩날림 ---- */
      pos += aChaos * (uMorph * (1.0 - uMorph) * 3.4);

      /* ---- 모양 제자리 회전 ---- */
      if (uSpinY != 0.0) pos.xz = rot2(uSpinY) * pos.xz;
      if (uSpinZ != 0.0) pos.xy = rot2(uSpinZ) * pos.xy;

      pos *= uZoom;

      /* ---- 손끝/포인터 ---- */
      float pRad = uPointerRadius * mix(1.0, 0.55, shapeW);
      float glow = 0.0;
      float infl = 0.0;

      if (uFollow > 0.5) {
        // 손가락 2개: 최근 손 궤적을 따라 입자가 소용돌이친다
        vec3 c = aPhase < 0.25 ? uT0 : (aPhase < 0.5 ? uT1 : (aPhase < 0.75 ? uT2 : uT3));
        vec3 dv = pos - c;
        float rad = length(dv.xy);
        float R = uPointerRadius * 1.15;
        float inf = 1.0 - smoothstep(R * 0.12, R, rad);
        float ringR = (0.10 + 0.90 * fract(aPhase * 13.13)) * uPointerRadius * 0.62;
        float ang = uTime * (2.2 + 3.0 * fract(aPhase * 7.31)) + aPhase * 62.8;
        vec3 tgt = vec3(c.xy + vec2(cos(ang), sin(ang)) * ringR,
                        c.z + sin(ang * 1.7 + aPhase * 13.0) * 0.9);
        float w = inf * inf * uPointerStrength;
        pos = mix(pos, tgt, clamp(w * 1.5, 0.0, 0.96));
        glow += w * 2.0;
        infl = inf;
      } else {
        vec3 d = pos - uPointer;
        float dist = length(d);
        infl = 1.0 - smoothstep(0.0, pRad, dist);
        float str = infl * uPointerStrength * mix(1.0, 0.18, shapeW);
        if (str > 0.0015) {
          vec3 n = d / max(dist, 0.0001);
          float angSnow = uTime * 2.4 * infl * infl + str * 1.5;
          float angTree = (sin(uTime * 1.3) * 0.75 + str * 1.2) * 0.26;
          float spin = mix(angSnow, angTree, shapeW);
          float pullIn = 1.0 - 0.62 * str;
          vec2 dxy = rot2(spin) * (d.xy * pullIn);
          pos += vec3(dxy - d.xy, 0.0);
          float ringPull = infl * (1.0 - infl) * 4.0;
          pos -= n * ringPull * str * mix(2.2, 0.6, shapeW);
          float coreP = 1.0 - smoothstep(0.0, pRad * 0.20, dist);
          pos += n * coreP * str * 1.3;
          pos.z += sin(dist * 2.2 - uTime * 2.6) * infl * str * 0.5;
          glow += infl * uPointerStrength * mix(4.0, 0.10, shapeW) + coreP * str * mix(5.0, 0.20, shapeW);
        }
      }

      /* ---- 터치 파문 ---- */
      float wt = uTime - uWave.w;
      if (wt > 0.0 && wt < 2.2) {
        float wr = wt * 8.5;
        float dd = length(pos - uWave.xyz);
        float ring = 1.0 - abs(dd - wr) / 1.7;
        ring = max(ring, 0.0); ring = ring * ring * (1.0 - wt / 2.2);
        pos += normalize(pos - uWave.xyz + vec3(0.0001, 0.0001, 0.0001)) * ring * 1.1;
        glow += ring * 2.0;
      }

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;

      float size = aSize * uSizeMul * (1.0 + infl * uPointerStrength * mix(2.2, 0.2, shapeW));
      float pxSize = clamp(size * uDPR * (31.0 / max(-mv.z, 0.1)), 0.85, 42.0);
      gl_PointSize = pxSize;
      float sizeAlpha = clamp(9.0 / max(pxSize, 1.0), 0.30, 1.15);

      vColor = col * (1.0 + shapeW * 0.10) * (1.16 - 0.50 * smoothstep(9.0, 26.0, -mv.z));
      float tw = 0.55 + 0.45 * sin(uTime * (0.9 + aSpeed * 2.2) + aPhase * 6.2831);
      vAlpha = mix(0.34 + 0.30 * tw, 0.30 + 0.34 * tw, shapeW) * sizeAlpha * uAlphaMul;
      vGlow = glow;
    }
  `;

  const fragmentShader = /* glsl */`
    uniform float uShapeMix;
    varying vec3  vColor;
    varying float vGlow;
    varying float vAlpha;

    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float r2 = dot(uv, uv);
      if (r2 > 0.25) discard;
      float r = sqrt(r2) * 2.0;

      float core = 1.0 - smoothstep(0.25, 1.0, r);
      core *= core;

      float ang = atan(uv.y, uv.x);
      float arms = pow(abs(cos(ang * 3.0)), 6.0);
      float flake = arms * (1.0 - smoothstep(0.35, 1.0, r));

      float cross = max(1.0 - abs(uv.x) * 15.0, 0.0) + max(1.0 - abs(uv.y) * 15.0, 0.0);
      cross *= (1.0 - smoothstep(0.3, 1.0, r));

      float shape = core * (1.0 - uShapeMix * 0.42) + (flake * 1.15 + cross * 0.22) * uShapeMix;
      float a = shape * vAlpha;
      if (a < 0.004) discard;

      vec3 col = vColor * (1.0 + vGlow * 1.7);
      gl_FragColor = vec4(col, a);
    }
  `;

  const uniforms = {
    uTime:            { value: 0 },
    uMorph:           { value: 1 },
    uFromSnow:        { value: 1 },
    uToSnow:          { value: 1 },
    uZoom:            { value: 1 },
    uDPR:             { value: 1 },
    uSizeMul:         { value: 1 },
    uAlphaMul:        { value: 1 },
    uSpinY:           { value: 0 },
    uSpinZ:           { value: 0 },
    uFollow:          { value: 0 },
    uBox:             { value: new THREE.Vector3(14, 8, 10) },
    uPointer:         { value: new THREE.Vector3(0, 0, 0) },
    uPointerStrength: { value: 0 },
    uPointerRadius:   { value: 4 },
    uT0:              { value: new THREE.Vector3() },
    uT1:              { value: new THREE.Vector3() },
    uT2:              { value: new THREE.Vector3() },
    uT3:              { value: new THREE.Vector3() },
    uWave:            { value: new THREE.Vector4(0, 0, 0, -99) },
    uShapeMix:        { value: 0.85 }
  };

  const material = new THREE.ShaderMaterial({
    uniforms, vertexShader, fragmentShader,
    transparent: true, blending: THREE.AdditiveBlending,
    depthTest: false, depthWrite: false
  });

  /* ---------- 지오메트리 ---------- */
  const geometry = new THREE.BufferGeometry();
  const fromPosAttr = new THREE.BufferAttribute(A.fromPos, 3);
  const attrList = {
    position: fromPosAttr,
    aFromPos: fromPosAttr,
    aFromColor: new THREE.BufferAttribute(A.fromCol, 3),
    aToPos: new THREE.BufferAttribute(A.toPos, 3),
    aToColor: new THREE.BufferAttribute(A.toCol, 3),
    aSnow: new THREE.BufferAttribute(A.snow, 3),
    aChaos: new THREE.BufferAttribute(A.chaos, 3),
    aSize: new THREE.BufferAttribute(A.size, 1),
    aPhase: new THREE.BufferAttribute(A.phase, 1),
    aSpeed: new THREE.BufferAttribute(A.speed, 1)
  };
  for (const k in attrList) geometry.setAttribute(k, attrList[k]);
  geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 1e3);

  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  scene.add(points);

  /* ---------- 손끝 궤적 빛 ---------- */
  const TRAIL_N = 220;
  const trailPos = new Float32Array(TRAIL_N * 3);
  const trailFade = new Float32Array(TRAIL_N);
  const trailSize = new Float32Array(TRAIL_N);
  for (let i = 0; i < TRAIL_N; i++) {
    const t = i / (TRAIL_N - 1);
    trailFade[i] = Math.pow(1 - t, 2.2);
    trailSize[i] = 13.0 * (1 - t) + 1.4;
  }
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  trailGeo.setAttribute('aFade', new THREE.BufferAttribute(trailFade, 1));
  trailGeo.setAttribute('aSizeT', new THREE.BufferAttribute(trailSize, 1));

  const trailMat = new THREE.ShaderMaterial({
    uniforms: { uDPR: { value: 1 }, uOpacity: { value: 0 } },
    vertexShader: /* glsl */`
      attribute float aFade;
      attribute float aSizeT;
      uniform float uDPR;
      uniform float uOpacity;
      varying float vA;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSizeT * uDPR * (26.0 / max(-mv.z, 0.1)), 1.0, 46.0);
        vA = aFade * uOpacity;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vA;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float r = length(uv) * 2.0;
        if (r > 1.0) discard;
        float a = (1.0 - r);
        a = a * a * vA;
        gl_FragColor = vec4(1.0, 0.94, 0.80, a);
      }
    `,
    transparent: true, blending: THREE.AdditiveBlending,
    depthTest: false, depthWrite: false
  });
  const trail = new THREE.Points(trailGeo, trailMat);
  trail.frustumCulled = false;
  scene.add(trail);

  /* =========================================================
     모드 정의
     ========================================================= */
  const MODES = {
    snow:    { badge: '❄️ 눈보라',            sizeMul: 1.00, alphaMul: 1.00, ext: [4.4, 8.0] },
    tree:    { badge: '🎄 트리·장식·별',       sizeMul: 1.02, alphaMul: 0.96, ext: [3.6, 5.8] },
    snowman: { badge: '⛄ 눈사람',             sizeMul: 0.98, alphaMul: 0.66, ext: [2.6, 4.9] },
    follow:  { badge: '✨ 눈 입자 손 따라가기', sizeMul: 1.05, alphaMul: 1.00, ext: [4.4, 8.0] },
    deer:    { badge: '🦌 사슴',               sizeMul: 0.96, alphaMul: 0.85, ext: [3.4, 3.5] },
    gift:    { badge: '🎁 리본 선물 상자',      sizeMul: 0.96, alphaMul: 0.85, ext: [3.2, 3.4] },
    flake:   { badge: '❄️ 눈결정',             sizeMul: 0.90, alphaMul: 0.88, ext: [4.2, 4.2] },
    santa:   { badge: '🎅 메리 크리스마스',     sizeMul: 0.80, alphaMul: 0.90, ext: [4.7, 3.1] }
  };
  const SHAPE_IDS = ['tree', 'snowman', 'deer', 'gift', 'flake', 'santa'];
  const shapes = {};

  /* =========================================================
     레이아웃
     ========================================================= */
  let dprCap = 2;
  let qualityStep = 0;
  let halfW = 8, halfH = 5;

  function layout() {
    const w = Math.max(window.innerWidth, 1);
    const h = Math.max(window.innerHeight, 1);
    const aspect = w / h;

    camera.aspect = aspect;
    const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    let z = 15;
    if (z * tanHalf * aspect < 4.4) z = 4.4 / (tanHalf * aspect);
    camera.position.set(0, 0, z);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, dprCap));
    renderer.setSize(w, h, false);

    halfH = z * tanHalf;
    halfW = halfH * aspect;
    uniforms.uBox.value.set(halfW * 1.14, halfH * 1.10, Math.min(halfW, halfH) * 0.85);
    uniforms.uDPR.value = renderer.getPixelRatio();
    trailMat.uniforms.uDPR.value = renderer.getPixelRatio();
    uniforms.uPointerRadius.value = clamp(halfW * 0.55, 2.4, 7.4);
  }

  function zoomFor(name) {
    const m = MODES[name];
    if (!m || name === 'snow' || name === 'follow') return 1;
    const fitW = (halfW * 0.94) / m.ext[0];
    const fitH = (halfH * 0.92) / m.ext[1];
    return clamp(Math.min(fitW, fitH), 0.72, 2.2);
  }

  /* =========================================================
     상태 · 모프
     ========================================================= */
  let mode = 'snow';
  let morph = 1;
  let fromSnow = 1;
  let toSnow = 1;
  let zoom = 1;
  let strength = 0;
  let strengthTarget = 0;
  let lastPointerMove = 0;
  let time = 0;
  let running = true;

  const pointerWorld = new THREE.Vector3(0, 0, 0);
  const targetNDC = new THREE.Vector2(0, 0);
  const smoothNDC = new THREE.Vector2(0, 0);
  const ndcVec = new THREE.Vector3();
  const dirVec = new THREE.Vector3();
  let pointerHasPos = false;

  function screenToWorld(nx, ny, out) {
    ndcVec.set(nx, ny, 0.5).unproject(camera);
    dirVec.copy(ndcVec).sub(camera.position).normalize();
    const t = -camera.position.z / (dirVec.z || -1e-6);
    out.copy(camera.position).addScaledVector(dirVec, t);
    return out;
  }

  const mod2 = (v) => ((v % 2) + 2) % 2;

  // 현재 화면 위치를 aFrom 으로 굳힌다 (전환 중이어도 이어지게)
  function snapshotCurrent() {
    const t = time;
    const PH = A.phase, SP = A.speed, SN = A.snow;
    const box = uniforms.uBox.value;
    const fp = A.fromPos, fc = A.fromCol, tp = A.toPos, tc = A.toCol;
    const fs = fromSnow > 0.5, ts = toSnow > 0.5, m = morph;
    for (let i = 0; i < COUNT; i++) {
      const i3 = i * 3;
      const ph = PH[i], sp = SP[i];
      const fall = mod2(SN[i3 + 1] - t * (0.030 + sp * 0.048) + ph) - 1;
      const sx = SN[i3] * box.x + Math.sin(t * 0.52 + ph * 6.2831 + fall * 3.2) * (0.20 + 0.32 * sp)
               + Math.sin(fall * box.y * 0.52 + t * 0.38) * 0.95;
      const sy = fall * box.y;
      const sz = SN[i3 + 2] * box.z + Math.cos(t * 0.44 + ph * 5.1) * 0.30;

      let fx, fy, fz, fr, fg, fb;
      if (fs) { fx = sx; fy = sy; fz = sz; fr = fg = fb = 0.9; }
      else { fx = fp[i3]; fy = fp[i3 + 1]; fz = fp[i3 + 2]; fr = fc[i3]; fg = fc[i3 + 1]; fb = fc[i3 + 2]; }

      let tx, ty, tz, tr, tg, tb;
      if (ts) { tx = sx; ty = sy; tz = sz; tr = tg = tb = 0.9; }
      else { tx = tp[i3]; ty = tp[i3 + 1]; tz = tp[i3 + 2]; tr = tc[i3]; tg = tc[i3 + 1]; tb = tc[i3 + 2]; }

      fp[i3] = fx + (tx - fx) * m;
      fp[i3 + 1] = fy + (ty - fy) * m;
      fp[i3 + 2] = fz + (tz - fz) * m;
      fc[i3] = fr + (tr - fr) * m;
      fc[i3 + 1] = fg + (tg - fg) * m;
      fc[i3 + 2] = fb + (tb - fb) * m;
    }
    fromSnow = 0;
  }

  function setMode(next, source) {
    if (!MODES[next]) return;
    if (next === mode) { updateUI(); return; }
    snapshotCurrent();
    mode = next;
    if (next === 'snow' || next === 'follow') {
      toSnow = 1;
    } else {
      toSnow = 0;
      const s = shapes[next];
      A.toPos.set(s.pos);
      A.toCol.set(s.col);
      attrList.aToPos.needsUpdate = true;
      attrList.aToColor.needsUpdate = true;
    }
    morph = 0;
    uniforms.uMorph.value = 0;
    attrList.aFromPos.needsUpdate = true;
    attrList.aFromColor.needsUpdate = true;
    uniforms.uFromSnow.value = fromSnow;
    uniforms.uToSnow.value = toSnow;
    uniforms.uFollow.value = next === 'follow' ? 1 : 0;
    updateUI();
    if (source === 'gesture') {
      const g = GESTURE_BY_MODE[next];
      toast(g ? `${g.emoji} ${g.name} → ${MODES[next].badge}` : MODES[next].badge, 1700);
    } else if (source === 'chip') {
      toast(MODES[next].badge, 1400);
    }
    if (music.on && next !== 'follow' && next !== 'snow') music.chime();
  }

  function updateUI() {
    badgeMode.textContent = MODES[mode].badge;
    btnSnow.classList.toggle('active', mode === 'snow');
    for (const b of chipsEl.querySelectorAll('.chip')) {
      b.classList.toggle('active', b.dataset.mode === mode);
    }
    hintEl.classList.remove('show');
  }

  /* ---------- 제스처 → 모드 ---------- */
  const GESTURES = {
    0: { mode: 'santa',   emoji: '✊', name: '주먹' },
    1: { mode: 'snowman', emoji: '☝️', name: '손가락 1개' },
    2: { mode: 'follow',  emoji: '✌️', name: '손가락 2개' },
    3: { mode: 'deer',    emoji: '🤟', name: '손가락 3개' },
    4: { mode: 'gift',    emoji: '🖖', name: '손가락 4개' },
    5: { mode: 'flake',   emoji: '🖐', name: '손가락 5개' }
  };
  const GESTURE_BY_MODE = {};
  for (const k in GESTURES) GESTURE_BY_MODE[GESTURES[k].mode] = GESTURES[k];

  /* =========================================================
     포인터 입력
     ========================================================= */
  function pointerFromEvent(e) {
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -((e.clientY / window.innerHeight) * 2 - 1);
    targetNDC.set(nx, ny);
    pointerHasPos = true;
    smoothNDC.copy(targetNDC);

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    pointerFromEvent(e);
  }, { passive: true });

  canvas.addEventListener('pointerdown', (e) => {
    pointerFromEvent(e);
    uniforms.uWave.value.set(pointerWorld.x, pointerWorld.y, pointerWorld.z, time);

  }, { passive: true });

  canvas.addEventListener('pointerup', () => {
    lastPointerMove = performance.now();
  }, { passive: true });

  canvas.addEventListener('pointerleave', () => {
    if (handActive) return;
    lastPointerMove = performance.now() - 1200;
  });

  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (!t) return;
    pointerFromEvent({ clientX: t.clientX, clientY: t.clientY });
  }, { passive: true });

  /* =========================================================
     손 인식 (MediaPipe Hand Landmarker)
     ========================================================= */
  let handLandmarker = null;
  let FilesetResolverNS = null;
  let HandLandmarkerNS = null;
  let stream = null;
  let camOn = false;
  let camStarting = false;
  let handActive = false;
  let lastHandSeen = 0;
  let lastDetect = 0;
  let lastVideoTime = -1;
  let handFps = 0;
  let handFpsN = 0, handFpsT = 0;

  const HAND_CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];

  let gestureBadgeText = '', gestureBadgeOn = null, gestureBadgeGold = null;
  function setGestureBadge(text, on, gold) {
    if (text !== gestureBadgeText) { badgeGesture.textContent = text; gestureBadgeText = text; }
    if (on !== gestureBadgeOn) { badgeGesture.classList.toggle('on', !!on); gestureBadgeOn = on; }
    if (gold !== gestureBadgeGold) { badgeGesture.classList.toggle('gold', !!gold); gestureBadgeGold = gold; }
  }

  const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));

  // 손가락 개수 0~5 (엄지는 손바닥 중심 기준으로 판별)
  function fingerCount(lm) {
    const wrist = lm[0];
    const palm = Math.max(dist2(lm[0], lm[9]), 1e-4);
    let ext = 0;
    const F = [[8, 6, 5], [12, 10, 9], [16, 14, 13], [20, 18, 17]];
    for (const [tip, pip, mcp] of F) {
      const dTip = dist2(lm[tip], lm[mcp]);
      const dPip = dist2(lm[pip], lm[mcp]);
      const far = dist2(lm[tip], wrist) > dist2(lm[pip], wrist) * 1.14;
      if (dTip > dPip * 1.32 && far) ext++;
    }
    // 엄지: 손가락 밑동(새끼)에서 멀고, 손바닥 중심에서도 충분히 멀면 펴진 것
    const thumbOut =
      dist2(lm[4], lm[17]) > dist2(lm[2], lm[17]) * 1.14 &&
      dist2(lm[4], lm[9]) > palm * 0.92;
    if (thumbOut) ext++;
    return ext;
  }

  const countHist = [];
  let gestureCandidate = null;
  let gestureSince = 0;

  function updateGesture(lm) {
    const raw = fingerCount(lm);
    countHist.push(raw);
    if (countHist.length > 7) countHist.shift();
    // 최빈값(동률이면 최근 값)
    let count = raw, best = 0;
    for (let v = 0; v <= 5; v++) {
      let n = 0;
      for (const x of countHist) if (x === v) n++;
      if (n > best || (n === best && v === raw)) { best = n; count = v; }
    }
    const g = GESTURES[count];
    const now = performance.now();
    if (!g) { gestureCandidate = null; return; }

    if (gestureCandidate !== g.mode) {
      gestureCandidate = g.mode;
      gestureSince = now;
      return;
    }
    const held = now - gestureSince;
    if (held > 350) {
      setGestureBadge(`${g.emoji} ${g.name} → ${MODES[g.mode].badge}`, true, true);
      if (mode !== g.mode) setMode(g.mode, 'gesture');
    } else {
      setGestureBadge(`${g.emoji} ${g.name} …`, true, false);
    }
  }

  function drawHand(lm) {
    const w = handCanvas.width, h = handCanvas.height;
    handCtx.clearRect(0, 0, w, h);
    if (!lm) return;
    const px = (p) => (1 - p.x) * w;
    const py = (p) => p.y * h;

    handCtx.lineWidth = 3;
    handCtx.strokeStyle = 'rgba(150,205,255,.75)';
    handCtx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      handCtx.moveTo(px(lm[a]), py(lm[a]));
      handCtx.lineTo(px(lm[b]), py(lm[b]));
    }
    handCtx.stroke();

    for (let i = 0; i < lm.length; i++) {
      const isTip = (i === 4 || i === 8 || i === 12 || i === 16 || i === 20);
      handCtx.beginPath();
      handCtx.arc(px(lm[i]), py(lm[i]), isTip ? 5.5 : 3, 0, PI2);
      handCtx.fillStyle = isTip ? 'rgba(255,232,160,.98)' : 'rgba(210,235,255,.85)';
      handCtx.shadowColor = isTip ? 'rgba(255,215,120,.95)' : 'rgba(140,200,255,.8)';
      handCtx.shadowBlur = isTip ? 14 : 7;
      handCtx.fill();
    }
    handCtx.shadowBlur = 0;
  }

  function handleHand(result) {
    const now = performance.now();
    if (result && result.landmarks && result.landmarks.length) {
      const lm = result.landmarks[0];
      lastHandSeen = now;
      if (!handActive) {
        handActive = true;
        cursorEl.classList.add('show');
        setGestureBadge('✋ 손을 찾았어요', true, false);
        // 손이 처음 보이면 트리·장식·별을 보여 준다
        if (mode === 'snow') setMode('tree', 'gesture');
      }

      const tip = lm[8];
      const nx = 1 - tip.x;
      const ny = tip.y;
      const ndcX = clamp(nx * 2 - 1, -1.1, 1.1);
      const ndcY = clamp(-(ny * 2 - 1), -1.1, 1.1);
      targetNDC.set(ndcX, ndcY);
      pointerHasPos = true;
      lastPointerMove = now;
      strengthTarget = 1;

      cursorEl.style.left = (nx * window.innerWidth) + 'px';
      cursorEl.style.top = (ny * window.innerHeight) + 'px';

      updateGesture(lm);
      drawHand(lm);

      handFpsN++;
      if (now - handFpsT > 900) {
        handFps = Math.round(handFpsN / ((now - handFpsT) / 1000));
        handFpsN = 0; handFpsT = now;
      }
    } else {
      if (handActive && now - lastHandSeen > 700) {
        handActive = false;
        cursorEl.classList.remove('show');
        setGestureBadge(camOn ? '🖐 손을 기다리는 중' : '📷 카메라 꺼짐', false, false);
        drawHand(null);
        gestureCandidate = null;
        countHist.length = 0;
        strengthTarget = 0;
      }
    }
  }

  async function ensureLandmarker() {
    if (handLandmarker) return;
    if (!FilesetResolverNS) {
      const mod = await import(MP_BUNDLE);
      FilesetResolverNS = mod.FilesetResolver;
      HandLandmarkerNS = mod.HandLandmarker;
    }
    const fileset = await FilesetResolverNS.forVisionTasks(MP_WASM);
    const opts = {
      baseOptions: { modelAssetPath: MP_MODEL, delegate: 'GPU' },
      runningMode: 'VIDEO',
      numHands: 1,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    };
    try {
      handLandmarker = await HandLandmarkerNS.createFromOptions(fileset, opts);
    } catch (e) {
      opts.baseOptions = { modelAssetPath: MP_MODEL, delegate: 'CPU' };
      handLandmarker = await HandLandmarkerNS.createFromOptions(fileset, opts);
    }
  }

  async function startCamera() {
    if (camStarting || camOn) return;
    camStarting = true;
    btnCam.disabled = true;
    btnCam.textContent = '📷 카메라 준비 중…';
    setGestureBadge('⏳ 카메라 준비 중', false, false);

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('getUserMedia 없음');
      }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, max: 30 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      await new Promise((res) => {
        if (video.readyState >= 1) return res();
        video.onloadedmetadata = () => res();
        setTimeout(res, 2500);
      });

      const miniW = 132;
      const ratio = (video.videoHeight || 480) / (video.videoWidth || 640);
      video.style.height = Math.round(miniW * ratio) + 'px';
      handCanvas.style.height = Math.round(miniW * ratio) + 'px';
      handCanvas.width = Math.round(miniW * 2);
      handCanvas.height = Math.round(miniW * ratio * 2);

      setGestureBadge('⏳ 손 인식 모델 불러오는 중', false, false);
      await ensureLandmarker();

      camOn = true;
      $('camwrap').classList.add('show');
      btnCam.textContent = '📷 카메라 끄기';
      btnCam.classList.add('active');
      setGestureBadge('🖐 손을 기다리는 중', false, false);
      toast('손을 카메라에 보여 주세요. 손가락 개수로 모양이 바뀌어요!', 3600);
    } catch (err) {
      window.__snowErrors.push('camera: ' + (err && err.message));
      stopCamera(true);
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      toast(denied
        ? '카메라 권한이 거부되었어요. 아래 칩으로 모든 모양을 그대로 볼 수 있어요.'
        : '카메라를 열 수 없어요. 아래 칩으로 모든 모양을 그대로 볼 수 있어요.', 4200);
    } finally {
      camStarting = false;
      btnCam.disabled = false;
      if (!camOn) btnCam.textContent = '📷 카메라 손 인식';
    }
  }

  function stopCamera(silent) {
    camOn = false;
    handActive = false;
    handFps = 0;
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    video.srcObject = null;
    $('camwrap').classList.remove('show');
    cursorEl.classList.remove('show');
    handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
    btnCam.textContent = '📷 카메라 손 인식';
    btnCam.classList.remove('active');
    if (!silent) setGestureBadge('📷 카메라 꺼짐', false, false);
    strengthTarget = 0;
    gestureCandidate = null;
    countHist.length = 0;
  }

  /* =========================================================
     오르골 (Web Audio)
     ========================================================= */
  const music = {
    ctx: null, master: null, wet: null, timer: null,
    index: 0, nextTime: 0, on: false, bpm: 96,
    melody: [
      [64,1],[64,1],[64,2],
      [64,1],[64,1],[64,2],
      [64,1],[67,1],[60,1.5],[62,0.5],[64,4],
      [65,1],[65,1],[65,1.5],[65,0.5],
      [65,1],[64,1],[64,1],[64,1],
      [64,1],[62,1],[62,1],[64,1],
      [62,2],[67,2],
      [64,1],[64,1],[64,2],
      [64,1],[64,1],[64,2],
      [64,1],[67,1],[60,1.5],[62,0.5],[64,4],
      [65,1],[65,1],[65,1.5],[65,0.5],
      [65,1],[64,1],[64,1],[64,0.5],[64,0.5],
      [62,1],[62,1],[64,1],[62,1],
      [67,4]
    ],

    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.ratio.value = 3;
      this.master.connect(comp);
      comp.connect(this.ctx.destination);

      this.wet = this.ctx.createGain();
      this.wet.gain.value = 0.55;
      const delay = this.ctx.createDelay(1.0);
      delay.delayTime.value = 0.26;
      const fb = this.ctx.createGain();
      fb.gain.value = 0.32;
      const damp = this.ctx.createBiquadFilter();
      damp.type = 'lowpass';
      damp.frequency.value = 2600;
      this.wet.connect(delay);
      delay.connect(damp);
      damp.connect(fb);
      fb.connect(delay);
      delay.connect(this.master);
    },

    bell(midi, when, dur, vel) {
      const ctx = this.ctx;
      const f = 440 * Math.pow(2, (midi - 69) / 12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(Math.max(vel, 0.0002), when + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

      const partials = [[1, 1.0], [2.001, 0.34], [3.01, 0.13], [4.62, 0.05]];
      for (const [mult, amp] of partials) {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = f * mult;
        const pg = ctx.createGain();
        pg.gain.value = amp;
        o.connect(pg);
        pg.connect(g);
        o.start(when);
        o.stop(when + dur + 0.06);
      }
      g.connect(this.master);
      g.connect(this.wet);
    },

    schedule() {
      const ctx = this.ctx;
      if (!ctx) return;
      const beat = 60 / this.bpm;
      while (this.nextTime < ctx.currentTime + 0.7) {
        const [midi, beats] = this.melody[this.index % this.melody.length];
        const isDownbeat = (this.index % 4 === 0);
        this.bell(midi + 12, this.nextTime, Math.max(1.1, beats * beat * 1.9), 0.20);
        if (isDownbeat) this.bell(midi - 12, this.nextTime, 2.4, 0.075);
        this.nextTime += beats * beat;
        this.index++;
        if (this.index % this.melody.length === 0) {
          this.bell(48, this.nextTime, 3.2, 0.07);
          this.nextTime += beat * 2;
        }
      }
    },

    async start() {
      this.init();
      if (this.ctx.state === 'suspended') await this.ctx.resume().catch(() => {});
      this.on = true;
      this.index = 0;
      this.nextTime = this.ctx.currentTime + 0.15;
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setValueAtTime(this.master.gain.value || 0.0001, this.ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(0.30, this.ctx.currentTime + 1.4);
      clearInterval(this.timer);
      this.schedule();
      this.timer = setInterval(() => this.schedule(), 200);
    },

    stop() {
      this.on = false;
      clearInterval(this.timer);
      this.timer = null;
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setValueAtTime(this.master.gain.value, now);
      this.master.gain.linearRampToValueAtTime(0.0001, now + 0.9);
    },

    chime() {
      if (!this.on || !this.ctx) return;
      const t = this.ctx.currentTime;
      [72, 76, 79, 84].forEach((m, i) => this.bell(m, t + i * 0.11, 2.0, 0.12));
    }
  };

  /* =========================================================
     버튼 / 키보드
     ========================================================= */
  btnCam.addEventListener('click', () => {
    if (camOn) stopCamera(false);
    else startCamera();
  });

  btnSnow.addEventListener('click', () => {
    setMode('snow', 'chip');
    uniforms.uWave.value.set(0, 0, 0, time);
  });

  chipsEl.addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    setMode(b.dataset.mode, 'chip');
  });

  btnMusic.addEventListener('click', async () => {
    if (music.on) {
      music.stop();
      btnMusic.textContent = '🔔 오르골 소리';
      btnMusic.classList.remove('active');
    } else {
      await music.start();
      btnMusic.textContent = '🔕 오르골 끄기';
      btnMusic.classList.add('active');
    }
  });

  const KEY_MODES = ['snow', 'snowman', 'follow', 'deer', 'gift', 'flake', 'santa', 'tree'];
  window.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'c' || e.key === 'C') btnCam.click();
    else if (e.key === 'm' || e.key === 'M') btnMusic.click();
    else if (/^[0-7]$/.test(e.key)) {
      const m = KEY_MODES[+e.key];
      if (m) setMode(m, 'chip');
    }
  });

  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) {
      lastFrame = performance.now();
      requestAnimationFrame(frame);
    }
  });

  /* =========================================================
     애니메이션 루프
     ========================================================= */
  let lastFrame = performance.now();
  let fpsAcc = 0, fpsN = 0, fpsAvg = 60, fpsTime = 0, warmup = 1.6;

  const quad = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
  let quadAccum = 0;

  function frame(now) {
    if (!running) return;
    const dtRaw = (now - lastFrame) / 1000;
    lastFrame = now;
    const dt = clamp(dtRaw, 0.0005, 0.05);
    time += dt;

    // 모프 진행
    if (morph < 1) {
      morph = Math.min(1, morph + dt / 1.15);
      uniforms.uMorph.value = morph;
    }
    uniforms.uTime.value = time;

    // 모양별 크기·회전·확대
    const M = MODES[mode];
    uniforms.uSizeMul.value = M.sizeMul * (0.86 + 0.24 * zoom);
    uniforms.uAlphaMul.value = M.alphaMul;
    uniforms.uShapeMix.value = (mode === 'snow' || mode === 'follow') ? 0.85 : 0.40;
    const targetZoom = zoomFor(mode);
    zoom = lerp(zoom, targetZoom, 1 - Math.exp(-dt * 3.4));
    uniforms.uZoom.value = zoom;

    let sy = 0, szz = 0;
    if (mode === 'tree') sy = Math.sin(time * 0.22) * 0.13;
    else if (mode === 'snowman') sy = Math.sin(time * 0.30) * 0.11;
    else if (mode === 'deer') sy = Math.sin(time * 0.34) * 0.13;
    else if (mode === 'gift') sy = Math.sin(time * 0.42) * 0.16;
    else if (mode === 'flake') { szz = time * 0.32; sy = Math.sin(time * 0.30) * 0.06; }
    else if (mode === 'santa') sy = Math.sin(time * 0.20) * 0.035;
    uniforms.uSpinY.value = sy;
    uniforms.uSpinZ.value = szz;

    // 포인터 평활화
    if (pointerHasPos) {
      const k = 1 - Math.exp(-dt * 16);
      smoothNDC.lerp(targetNDC, k);
      screenToWorld(smoothNDC.x, smoothNDC.y, pointerWorld);
      uniforms.uPointer.value.copy(pointerWorld);
    }

    // 최근 손 궤적 4점 (손 따라가기)
    quadAccum += dt;
    if (quadAccum > 0.09) {
      quadAccum = 0;
      quad[3].copy(quad[2]); quad[2].copy(quad[1]); quad[1].copy(quad[0]);
      quad[0].copy(pointerWorld);
      uniforms.uT0.value.copy(quad[0]);
      uniforms.uT1.value.copy(quad[1]);
      uniforms.uT2.value.copy(quad[2]);
      uniforms.uT3.value.copy(quad[3]);
    }

    if (!handActive && !pDown) {
      if (performance.now() - lastPointerMove > 1400) strengthTarget = 0;
    }
    strength = lerp(strength, strengthTarget, 1 - Math.exp(-dt * 6.5));
    uniforms.uPointerStrength.value = strength;

    // 궤적 빛
    const followOn = mode === 'follow' ? 1 : 0;
    trailMat.uniforms.uOpacity.value = strength * (0.55 + 0.65 * followOn);
    if (strength > 0.02 && pointerHasPos) {
      trailPos.copyWithin(3, 0, (TRAIL_N - 1) * 3);
      trailPos[0] = pointerWorld.x;
      trailPos[1] = pointerWorld.y;
      trailPos[2] = pointerWorld.z;
      trailGeo.attributes.position.needsUpdate = true;
    }

    // 손 인식
    if (camOn && handLandmarker && video.readyState >= 2 && now - lastDetect > 33) {
      const vt = video.currentTime;
      if (vt !== lastVideoTime) {
        lastVideoTime = vt;
        lastDetect = now;
        try {
          const res = handLandmarker.detectForVideo(video, now);
          handleHand(res);
        } catch (err) {
          if (window.__snowErrors.length < 40) window.__snowErrors.push('detect: ' + err.message);
        }
      }
    }

    renderer.render(scene, camera);

    // 성능 감시 → 픽셀 비율만 낮춰 60fps 유지
    fpsAcc += 1 / Math.max(dtRaw, 0.001); fpsN++;
    if (now - fpsTime > 1200) {
      fpsAvg = fpsAcc / Math.max(fpsN, 1);
      fpsAcc = 0; fpsN = 0; fpsTime = now;
      if (warmup > 0) {
        warmup -= 1.2;
      } else if (fpsAvg < 40 && qualityStep === 0) {
        qualityStep = 1; dprCap = 1.6; layout();
      } else if (fpsAvg < 32 && qualityStep === 1) {
        qualityStep = 2; dprCap = 1.1; layout();
      }
    }

    requestAnimationFrame(frame);
  }

  let pDown = false;
  canvas.addEventListener('pointerdown', () => { pDown = true; });
  window.addEventListener('pointerup', () => { pDown = false; });
  window.addEventListener('pointercancel', () => { pDown = false; });

  /* =========================================================
     시작: 모양 7종 만들기
     ========================================================= */
  const BUILD_STEPS = [
    ['tree', '🎄 트리와 장식, 별을 만들고 있어요…', buildTree],
    ['snowman', '⛄ 눈사람을 만들고 있어요…', buildSnowman],
    ['deer', '🦌 사슴을 만들고 있어요…', buildDeer],
    ['gift', '🎁 선물 상자를 만들고 있어요…', buildGift],
    ['flake', '❄️ 눈결정을 만들고 있어요…', buildFlake],
    ['santa', '🎅 메리 크리스마스를 그리고 있어요…', buildSanta]
  ];

  async function buildAll() {
    for (let i = 0; i < BUILD_STEPS.length; i++) {
      const [id, label, fn] = BUILD_STEPS[i];
      loadingText.textContent = `${label} (${i + 1}/${BUILD_STEPS.length})`;
      await new Promise((r) => setTimeout(r, 16));
      shapes[id] = fn();
      await new Promise((r) => setTimeout(r, 0));
    }
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 220));

  badgeCount.textContent = '✨ ' + COUNT.toLocaleString('en-US') + ' 입자';
  updateUI();
  setGestureBadge('✋ 손을 보여 주세요', false, false);

  try {
    await buildAll();
  } catch (err) {
    window.__snowErrors.push('build: ' + (err && err.message));
  }

  uniforms.uMorph.value = 1;
  uniforms.uZoom.value = 1;
  renderer.render(scene, camera);

  requestAnimationFrame((t) => {
    lastFrame = t;
    frame(t);
    loadingEl.classList.add('hide');
    setTimeout(() => { loadingEl.style.display = 'none'; }, 800);
    setTimeout(() => hintEl.classList.add('show'), 900);
    setTimeout(() => hintEl.classList.remove('show'), 9000);
  });

  /* 디버그/검증용 읽기 전용 요약 */
  window.__snow = {
    get count() { return COUNT; },
    get mode() { return mode; },
    get morph() { return +morph.toFixed(3); },
    get zoom() { return +zoom.toFixed(3); },
    get strength() { return +strength.toFixed(3); },
    get fps() { return Math.round(fpsAvg); },
    get webgl2() { return !!(renderer.capabilities && renderer.capabilities.isWebGL2); },
    get camera() { return camOn; },
    get hand() { return handActive; },
    get shapes() { return Object.keys(shapes); },
    get errors() { return window.__snowErrors.slice(); },
    get pixelRatio() { return renderer.getPixelRatio(); },
    setMode: (m) => setMode(m, 'chip'),
    poke: (nx = 0, ny = 0) => {
      targetNDC.set(nx, ny);
      smoothNDC.set(nx, ny);
      pointerHasPos = true;
      strengthTarget = 1;
      lastPointerMove = performance.now() + 120000;
      return true;
    },
    calm: () => { strengthTarget = 0; lastPointerMove = 0; return true; },
    bench: (n = 30) => {
      const gl = renderer.getContext();
      const t0 = performance.now();
      for (let i = 0; i < n; i++) renderer.render(scene, camera);
      gl.finish();
      return +((performance.now() - t0) / n).toFixed(2);
    }
  };
  window.__snowReady = true;
  </script>
</body>
