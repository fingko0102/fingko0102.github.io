<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#05070c">
<meta name="description" content="3D ASCII 크리스마스 트리 — 30fps 트루컬러 아스키 애니메이션과 파이썬 코드 뷰어">
<title>ASCII Christmas Tree · tree.py</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#02040a;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#dfe8f3;
  }
  #app{
    position:relative;width:100%;max-width:820px;height:100vh;height:100dvh;margin:0 auto;
    display:flex;flex-direction:column;background:#05070c;
    box-shadow:0 0 0 1px #0d1826, 0 0 60px rgba(0,0,0,.8);
  }
  /* ---------- stage (58%) ---------- */
  #stage{position:relative;flex:0 0 58%;min-height:0;overflow:hidden;background:#05070c}
  #treeCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #treeCanvas.drag{cursor:grabbing}
  .hud{
    position:absolute;left:0;right:0;height:26px;display:flex;align-items:center;gap:7px;
    padding:0 12px;font:500 11px/1 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:#71859b;letter-spacing:.02em;pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden;
  }
  .hud-top{top:0;background:linear-gradient(180deg,rgba(5,7,12,.94) 40%,rgba(5,7,12,0))}
  .hud-bottom{bottom:0;background:linear-gradient(0deg,rgba(5,7,12,.94) 40%,rgba(5,7,12,0))}
  .hud .file{color:#9fb4c9}
  .hud .sep{color:#2f4155}
  .hud .grow{flex:1}
  .hud .k{color:#5b6f85}
  .hud .v{color:#a9bccf}
  .dot{width:6px;height:6px;border-radius:50%;background:#3ddc84;box-shadow:0 0 7px #3ddc84;flex:0 0 auto}
  .dot.paused{background:#ffc857;box-shadow:0 0 7px #ffc857}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .dot{animation:pulse 1.8s ease-in-out infinite}
  #hint{transition:opacity .8s ease;opacity:.85}
  #hint.off{opacity:0}
  /* ---------- ide (42%) ---------- */
  #ide{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    background:#070b12;border-top:1px solid #12202e;position:relative;
  }
  .ide-head{
    display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;
    background:#0a1019;border-bottom:1px solid #101d2a;flex:0 0 auto;
  }
  .tabs{display:flex;gap:2px;align-items:center;min-width:0;overflow:hidden}
  .tab{
    font:600 11.5px/1 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:#5f7488;padding:5px 9px;border-radius:5px 5px 0 0;white-space:nowrap;
  }
  .tab.active{color:#cfdae6;background:#0e1826;box-shadow:inset 0 1px 0 #24405c}
  .btns{display:flex;gap:5px;margin-left:auto;flex:0 0 auto}
  .btns button{
    font:600 11.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;
    color:#a9bbcc;background:#101b28;border:1px solid #1b2b3d;border-radius:6px;
    padding:6px 9px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
  }
  .btns button:hover{background:#16273a;color:#dbe7f2;border-color:#2b4663}
  .btns button:active{transform:translateY(1px)}
  .btns button[aria-pressed="true"]{background:#123a2a;border-color:#2f7d58;color:#8bffc0}
  #codeScroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:#1d3348 transparent;
    padding:6px 0 10px;
  }
  #codeScroll::-webkit-scrollbar{width:7px}
  #codeScroll::-webkit-scrollbar-thumb{background:#1b2c3f;border-radius:4px}
  .code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    font-size:11.5px;line-height:1.5;white-space:pre;tab-size:4}
  .ln{display:flex;align-items:baseline;padding:0 8px 0 0;border-left:2px solid transparent;
      transition:background .18s ease,border-color .18s ease}
  .ln .n{
    flex:0 0 auto;text-align:right;color:#33475c;padding:0 9px 0 6px;user-select:none;
    font-size:.88em;letter-spacing:-.02em;min-width:2.6em;
  }
  .ln .t{flex:1 1 auto;white-space:pre;overflow:hidden;text-overflow:clip}
  .ln.active{background:rgba(61,220,132,.075);border-left-color:#3ddc84}
  .ln.active .n{color:#5ce49b}
  .tok-kw{color:#ff7ab2}
  .tok-def{color:#79d2ff}
  .tok-str{color:#a8e6a3}
  .tok-num{color:#ffcf7a}
  .tok-com{color:#4b6076;font-style:italic}
  .tok-bi{color:#c6a8ff}
  .tok-op{color:#8fa8bf}
  #toast{
    position:absolute;left:50%;bottom:14px;transform:translate(-50%,14px);
    background:#122334;color:#c8ffdd;border:1px solid #2c6f4c;border-radius:8px;
    padding:8px 14px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:20;white-space:nowrap;
    box-shadow:0 6px 24px rgba(0,0,0,.6);
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:520px){
    .hud{font-size:10px;padding:0 9px;gap:5px}
    .btns button{padding:5px 7px;font-size:11px}
    .tab{padding:5px 7px;font-size:11px}
    #tabAlt{display:none}
  }
  @media (max-height:560px){ #stage{flex-basis:56%} }
</style>
</head>

      <span class="dot" id="dot"></span>

        <button id="btnCopy" type="button">코드 복사</button>

    </div>
    <div id="codeScroll"><div class="code" id="code"></div></div>

  </section>
</div>

<script>
(function(){
  'use strict';

  /* ================= palette ================= */
  var PAL = [];
  function rgb(r,g,b){ return 'rgb('+(r<0?0:r>255?255:r|0)+','+(g<0?0:g>255?255:g|0)+','+(b<0?0:b>255?255:b|0)+')'; }
  function ramp(base,n,f0){
    var out=[],k,f;
    f0 = (f0===undefined)?0.09:f0;
    for(k=0;k<n;k++){
      f=f0+(1-f0)*k/(n-1);
      PAL.push(rgb(base[0]*f, base[1]*f, base[2]*f));
      out.push(PAL.length-1);
    }
    return out;
  }
  var LEAF_C  = ramp([170,255,190],16,0.22);
  var TRUNK_C = ramp([168,110,62],6);
  var SNOW_C  = ramp([226,242,255],3);
  var STAR_C  = ramp([255,244,168],4);
  var BULB_C  = [
    ramp([255,66,66],5),  ramp([255,212,78],5), ramp([88,172,255],5),
    ramp([198,118,255],5),ramp([255,255,255],5),ramp([86,255,150],5)
  ];
  var CHARS = '.,~+o*#@';

  /* ================= scene ================= */
  var TAU = Math.PI*2, CAM = 5.2, R = 1.34, Y0 = -1.02, Y1 = 1.30;
  var LIGHT = [-0.40,0.70,0.58];      /* key: upper left, front */
  var FILL  = [0.62,0.18,0.76];       /* fill: right, front */

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var LEAF = [];   /* x,y,z, nx,ny,nz, seed */
  var BULBS = [];  /* x,y,z, nx,ny,nz, colorIdx, phase */
  var TRUNK = [];  /* x,y,z, nx,ny,nz */

  (function build(){
    var rnd = mulberry32(11), i, j, u, y, r, n, a, rr, nl, x, z;
    nl = Math.hypot(1, 0.62);
    for(i=0;i<104;i++){
      u = i/103;
      y = Y0 + (Y1-Y0)*u;
      r = R*Math.pow(1-u,0.90)*(1+0.055*Math.sin(u*24));
      n = Math.round(4 + 30*(1-u));
      for(j=0;j<n;j++){
        a  = u*9*TAU + j*TAU/n + (rnd()-0.5)*0.26;
        rr = r*(1+(rnd()-0.5)*0.15);
        if(rnd() < 0.20) continue;
        x = Math.cos(a)*rr; z = Math.sin(a)*rr;
        LEAF.push(x, y+(rnd()-0.5)*0.06, z,
                  Math.cos(a)/nl, 0.62/nl, Math.sin(a)/nl, rnd());
      }
    }
    for(i=0;i<92;i++){
      u = 0.045 + 0.905*i/91;
      a = u*7*TAU;
      r = R*Math.pow(1-u,0.90) + 0.045;
      x = Math.cos(a)*r; z = Math.sin(a)*r;
      BULBS.push(x, Y0+(Y1-Y0)*u, z, Math.cos(a), 0.5, Math.sin(a),
                 i%6, (i*1.7)%TAU);
    }
    for(i=0;i<14;i++){
      y = -1.50 + 0.48*i/13;
      for(j=0;j<18;j++){
        a = j*TAU/18 + i*0.21;
        TRUNK.push(Math.cos(a)*0.15, y, Math.sin(a)*0.15,
                   Math.cos(a), 0.25, Math.sin(a));
      }
    }
  })();

  var flakes = [];
  var NFLAKE_MAX = 320;
  (function makeSnow(){
    var rnd = mulberry32(5), i;
    for(i=0;i<NFLAKE_MAX;i++){
      flakes.push({
        x:(rnd()-0.5)*4.4, y:(rnd()-0.5)*3.8, z:(rnd()-0.5)*4.4,
        v:0.42+rnd()*0.75, ph:rnd()*TAU, sz:rnd()
      });
    }
  })();
  var snowCount = 0, snowTarget = 190;

  /* ================= state ================= */
  var yaw = 0.6, pitch = 0.26, yawVel = 0.52, autoDir = 1;
  var lastDrag = -1e9, dragging = false, paused = false;
  var t0 = performance.now(), now = 0, T = 0;

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('treeCanvas');
  var ctx = canvas.getContext('2d');
  var FONT_FAMILY = 'ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace';

  var W=0,H=0,dpr=1,cols=0,rows=0,cellW=0,cellH=0,fontPx=0,FONT='';
  var axPx=1,cxPx=0,cyPx=0,contentTop=0,contentBottom=0,contentH=0;
  var zBuf=null,chBuf=null,coBuf=null;
  var bgGrad=null, groundGrad=null;
  var sprites = [];

  function sprite(chIdx,colorIdx){
    var key = colorIdx*8 + chIdx, c = sprites[key], g;
    if(c) return c;
    c = document.createElement('canvas');
    c.width = cellW; c.height = cellH;
    g = c.getContext('2d');
    g.font = FONT;
    g.textBaseline = 'top';
    g.fillStyle = PAL[colorIdx];
    g.fillText(CHARS.charAt(chIdx), 0, 0);
    sprites[key] = c;
    return c;
  }

  function layout(){
    var rect = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(160, Math.round(rect.width*dpr));
    H = Math.max(120, Math.round(rect.height*dpr));
    canvas.width = W; canvas.height = H;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';

    var aspect = W/H;
    var targetRows = aspect < 1.05 ? 35 : (aspect < 1.55 ? 31 : 28);
    fontPx = Math.max(9*dpr, Math.min(36*dpr, H/targetRows));
    cellH = Math.round(fontPx*1.02) || 1;
    FONT = fontPx.toFixed(1)+'px '+FONT_FAMILY;
    ctx.font = FONT;
    cellW = Math.max(2, Math.round(ctx.measureText('M').width));
    cols = Math.max(16, Math.floor(W/cellW));
    rows = Math.max(8, Math.floor(H/cellH));

    contentTop = Math.round(27*dpr);
    contentBottom = H - Math.round(27*dpr);
    contentH = contentBottom - contentTop;
    axPx = Math.min(W*0.46/(1.40/CAM), contentH*0.43/(1.58/CAM));
    cxPx = W/2;
    cyPx = contentTop + contentH*0.47;

    zBuf = new Float32Array(cols*rows);
    chBuf = new Int16Array(cols*rows);
    coBuf = new Uint16Array(cols*rows);
    sprites = [];

    ctx.setTransform(1,0,0,1,0,0);
    bgGrad = ctx.createRadialGradient(W*0.5, contentTop+contentH*0.42, 10,
                                      W*0.5, contentTop+contentH*0.42, Math.max(W,H)*0.62);
    bgGrad.addColorStop(0,'#0b1a14');
    bgGrad.addColorStop(0.45,'#070d12');
    bgGrad.addColorStop(1,'#04060b');
    groundGrad = ctx.createRadialGradient(cxPx, cyPx+contentH*0.26, 2,
                                          cxPx, cyPx+contentH*0.26, axPx*0.42);
    groundGrad.addColorStop(0,'rgba(80,255,180,.16)');
    groundGrad.addColorStop(0.55,'rgba(40,150,110,.05)');
    groundGrad.addColorStop(1,'rgba(0,0,0,0)');

    document.getElementById('cLeaf').textContent = (LEAF.length/7)|0;
    document.getElementById('cBulb').textContent = (BULBS.length/8)|0;
  }

  /* ================= drawing ================= */
  function draw(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);

    zBuf.fill(1e9);
    chBuf.fill(-1);

    var cyw = Math.cos(yaw), syw = Math.sin(yaw);
    var cpt = Math.cos(pitch), spt = Math.sin(pitch);
    var kx = axPx/cellW, ky = axPx/cellH;
    var cxCol = cxPx/cellW, cyRow = cyPx/cellH;
    var py = 0;
    var i, x, y, z, x1, z1, y1, z2, d, c, r, idx, nx0, ny0, nz0, nx1, nz1, ny1, nz2;
    var lam, rim, fill, s, k2;

    /* --- needles --- */
    for(i=0;i<LEAF.length;i+=7){
      x=LEAF[i]; y=LEAF[i+1]; z=LEAF[i+2];
      x1 =  x*cyw + z*syw;
      z1 = -x*syw + z*cyw;
      y1 =  y*cpt - z1*spt;
      z2 =  y*spt + z1*cpt;
      d = z2 + CAM;
      if(d < 0.45) continue;
      c = (cxCol + (x1/d)*kx)|0;
      if(c<0||c>=cols) continue;
      r = (cyRow - (y1/d)*ky)|0;
      if(r<0||r>=rows) continue;
      idx = r*cols+c;
      if(d >= zBuf[idx]) continue;

      nx0=LEAF[i+3]; ny0=LEAF[i+4]; nz0=LEAF[i+5];
      nx1 =  nx0*cyw + nz0*syw;
      nz1 = -nx0*syw + nz0*cyw;
      ny1 =  ny0*cpt - nz1*spt;
      nz2 =  ny0*spt + nz1*cpt;
      lam = nx1*LIGHT[0] + ny1*LIGHT[1] + nz2*LIGHT[2];
      fill = nx1*FILL[0] + ny1*FILL[1] + nz2*FILL[2];
      rim = Math.pow(Math.max(0, 1-Math.abs(nz2)), 0.65);
      s = 0.42 + 0.58*Math.max(0,lam) + 0.24*Math.max(0,fill);
      s *= 0.85 + 0.15*rim;             /* edges catch a little more light */
      s *= 1.05 - 0.09*(d-3.6);
      s *= 0.78 + 0.44*LEAF[i+6];       /* dappled needles */
      s *= 0.96 + 0.08*Math.sin(y*15.0);
      s += 0.05*Math.sin(T*3 + LEAF[i+6]*6.3);
      if(s<0.22) s=0.22; else if(s>1) s=1;
      k2 = 1 + (s*4.6)|0; if(k2>5) k2=5;
      zBuf[idx]=d;
      chBuf[idx]= k2;
      coBuf[idx]= LEAF_C[Math.min(15, (s*15.5)|0)];
    }

    /* --- bulbs --- */
    var br, ci2, phase;
    for(i=0;i<BULBS.length;i+=8){
      x=BULBS[i]; y=BULBS[i+1]; z=BULBS[i+2];
      x1 =  x*cyw + z*syw;
      z1 = -x*syw + z*cyw;
      y1 =  y*cpt - z1*spt;
      z2 =  y*spt + z1*cpt;
      d = z2 + CAM;
      if(d < 0.45) continue;
      c = (cxCol + (x1/d)*kx)|0;
      r = (cyRow - (y1/d)*ky)|0;
      if(c<0||c>=cols||r<0||r>=rows) continue;
      idx = r*cols+c;
      if(d >= zBuf[idx]) continue;
      phase = BULBS[i+7];
      br = 0.40 + 0.60*(0.5+0.5*Math.sin(T*3.2 + phase));
      ci2 = BULB_C[BULBS[i+6]][Math.min(4,(br*4.99)|0)];
      zBuf[idx]=d;
      chBuf[idx]= br>0.86 ? 7 : 4;
      coBuf[idx]= ci2;
    }

    /* --- trunk --- */
    for(i=0;i<TRUNK.length;i+=6){
      x=TRUNK[i]; y=TRUNK[i+1]; z=TRUNK[i+2];
      x1 =  x*cyw + z*syw;
      z1 = -x*syw + z*cyw;
      y1 =  y*cpt - z1*spt;
      z2 =  y*spt + z1*cpt;
      d = z2 + CAM;
      if(d < 0.45) continue;
      c = (cxCol + (x1/d)*kx)|0;
      r = (cyRow - (y1/d)*ky)|0;
      if(c<0||c>=cols||r<0||r>=rows) continue;
      idx = r*cols+c;
      if(d >= zBuf[idx]) continue;
      nx0=TRUNK[i+3]; nz0=TRUNK[i+5];
      nx1 =  nx0*cyw + nz0*syw;
      nz1 = -nx0*syw + nz0*cyw;
      lam = nx1*LIGHT[0] + 0.3*LIGHT[1] + nz1*LIGHT[2];
      s = 0.35 + 0.65*Math.max(0,lam);
      if(s<0) s=0; else if(s>1) s=1;
      zBuf[idx]=d;
      chBuf[idx]= 6;
      coBuf[idx]= TRUNK_C[Math.min(5,(s*5.99)|0)];
    }

    /* --- snow --- */
    var f, k;
    for(i=0;i<snowCount;i++){
      f = flakes[i];
      x=f.x; y=f.y; z=f.z;
      x1 =  x*cyw + z*syw;
      z1 = -x*syw + z*cyw;
      y1 =  y*cpt - z1*spt;
      z2 =  y*spt + z1*cpt;
      d = z2 + CAM;
      if(d < 0.6) continue;
      c = (cxCol + (x1/d)*kx)|0;
      r = (cyRow - (y1/d)*ky)|0;
      if(c<0||c>=cols||r<0||r>=rows) continue;
      idx = r*cols+c;
      if(d >= zBuf[idx]) continue;
      k = d < 3.6 ? 3 : (d < 5.2 ? 2 : 0);
      zBuf[idx]=d;
      chBuf[idx]= f.sz > 0.86 ? 5 : (f.sz > 0.5 ? 3 : 0);
      coBuf[idx]= SNOW_C[Math.min(2, Math.max(0, k-1))];
    }

    /* --- blit glyphs --- */
    var base, sp, ci3;
    for(r=0;r<rows;r++){
      base = r*cols;
      py = r*cellH;
      for(c=0;c<cols;c++){
        ci3 = chBuf[base+c];
        if(ci3 < 0) continue;
        sp = sprite(ci3, coBuf[base+c]);
        ctx.drawImage(sp, c*cellW, py);
      }
    }

    drawGlow();
    if(T - titleT > 0.08){ titleT = T; buildTitle(); }
    drawTitle();
  }

  function drawGlow(){
    /* soft ground light under the tree */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = groundGrad;
    ctx.beginPath();
    ctx.ellipse(cxPx, cyPx + contentH*0.26, axPx*0.44, axPx*0.13, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function projectPoint(x,y,z){
    var cyw = Math.cos(yaw), syw = Math.sin(yaw);
    var cpt = Math.cos(pitch), spt = Math.sin(pitch);
    var x1 =  x*cyw + z*syw;
    var z1 = -x*syw + z*cyw;
    var y1 =  y*cpt - z1*spt;
    var z2 =  y*spt + z1*cpt;
    var d = z2 + CAM;
    return {
      c: (cxPx/cellW) + (x1/d)*(axPx/cellW),
      r: (cyPx/cellH) - (y1/d)*(axPx/cellH),
      d: d
    };
  }

  var titleCv = null, titleT = -1, titleKey = '';

  function buildTitle(){
    var size = Math.min(cellH*1.75, W*0.082);
    var txt = 'MERRY CHRISTMAS';
    var cw = Math.ceil(W), chh = Math.ceil(size*2.6);
    if(!titleCv){ titleCv = document.createElement('canvas'); }
    if(titleCv.width !== cw || titleCv.height !== chh){
      titleCv.width = cw; titleCv.height = chh;
    }
    var g = titleCv.getContext('2d');
    g.clearRect(0,0,cw,chh);
    g.font = '700 '+size.toFixed(1)+'px '+FONT_FAMILY;
    var tw = g.measureText(txt).width;
    var sc = Math.min(1, (W*0.86)/tw);
    var x = cw/2 - (tw*sc)/2;
    var y = chh*0.5;
    var colsA = ['#ffe9a8','#9dffc0','#ffffff','#ffb3d0','#a8e0ff'];
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.setTransform(sc,0,0,1,x,0);
    var px = 0, i, ch, w, col, br;
    for(i=0;i<txt.length;i++){
      ch = txt.charAt(i);
      w = g.measureText(ch).width;
      br = 0.55 + 0.45*Math.sin(T*2.4 + i*0.62);
      col = colsA[i % colsA.length];
      g.globalAlpha = 0.55 + 0.45*br;
      g.shadowColor = col;
      g.shadowBlur = 10;
      g.fillStyle = col;
      g.fillText(ch, px + w/2, y);
      px += w;
    }
    g.setTransform(1,0,0,1,0,0);
    titleKey = '';
  }

  function drawTitle(){
    var size = Math.min(cellH*1.75, W*0.082);
    var chh = Math.ceil(size*2.6);
    if(!titleCv || !titleKey){
      if(titleCv && titleCv.width === Math.ceil(W) && titleCv.height === chh && titleKey === '') buildTitle();
      else { titleKey=''; buildTitle(); }
    }
    ctx.drawImage(titleCv, 0, contentBottom - chh + size*0.06);
  }

  function drawStar(){
    var p = projectPoint(0, Y1 + 0.30, 0);
    var pulse = 0.5 + 0.5*Math.sin(T*4.2);
    var size = cellH*(1.15 + 0.22*pulse);
    var col = pulse > 0.6 ? '#fffdf0' : '#ffe680';
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(p.c*cellW, p.r*cellH, 1, p.c*cellW, p.r*cellH, size*1.35);
    g.addColorStop(0,'rgba(255,240,160,'+(0.22+0.24*pulse)+')');
    g.addColorStop(1,'rgba(255,220,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.c*cellW, p.r*cellH, size*1.35, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.font = '700 '+size.toFixed(1)+'px '+FONT_FAMILY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,236,150,.95)';
    ctx.shadowBlur = size*0.55;
    ctx.fillStyle = col;
    ctx.fillText('*', p.c*cellW, p.r*cellH);
    ctx.restore();
  }

  /* ================= loop ================= */
  var last = 0, accT = 0, fpsAcc = 0, fpsN = 0, fpsShown = 30, lastHud = 0;
  var FRAME = 1/30;

  function updateSnow(dt){
    var i, f;
    for(i=0;i<NFLAKE_MAX;i++){
      f = flakes[i];
      f.y -= f.v*dt;
      f.x += Math.sin(T*1.3 + f.ph)*0.05*dt;
      if(f.y < -2.0){ f.y = 2.0; f.x = (Math.random()-0.5)*4.4; f.z = (Math.random()-0.5)*4.4; }
    }
  }

  function step(ts){
    requestAnimationFrame(step);
    if(!last){ last = ts; return; }
    var dt = (ts - last)/1000;
    last = ts;
    if(dt > 0.5) dt = 0.5;
    accT += dt;
    if(accT < FRAME*0.94) return;     /* hold 30 fps */
    var sdt = accT;
    accT = 0;

    if(!paused){
      T += sdt;
      if(!dragging && (ts - lastDrag) > 1100) yaw += autoDir*yawVel*sdt;
      updateSnow(sdt);
    }
    draw();
    drawStar();

    fpsAcc += sdt; fpsN++;
    if(fpsAcc > 0.6){
      fpsShown = Math.round(fpsN/fpsAcc);
      fpsAcc = 0; fpsN = 0;
      var el = document.getElementById('fpsLabel');
      if(el) el.textContent = paused ? '— fps' : (fpsShown || 30)+' fps';
    }
    if(ts - lastHud > 800){ lastHud = ts; updateHud(); }
  }

  function updateHud(){
    document.getElementById('cSnow').textContent = snowCount;
  }

  /* ================= input ================= */
  var px0=0, py0=0, moved=false;
  canvas.addEventListener('pointerdown', function(e){
    dragging = true; moved = false;
    px0 = e.clientX; py0 = e.clientY;
    canvas.classList.add('drag');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX-px0, dy = e.clientY-py0;
    if(Math.abs(dx) > 0.6 || Math.abs(dy) > 0.6) moved = true;
    yaw += dx*0.009;
    pitch = Math.max(-0.18, Math.min(0.85, pitch + dy*0.005));
    if(Math.abs(dx) > 1.2) autoDir = dx > 0 ? 1 : -1;
    px0 = e.clientX; py0 = e.clientY;
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    lastDrag = performance.now();
    canvas.classList.remove('drag');
    if(moved) document.getElementById('hint').classList.add('off');
    try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  /* ================= UI ================= */
  var btnPause = document.getElementById('btnPause');
  var btnSnow = document.getElementById('btnSnow');
  var btnCopy = document.getElementById('btnCopy');
  var toast = document.getElementById('toast');
  var toastTimer = 0;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('on'); }, 1600);
  }

  btnPause.addEventListener('click', function(){
    paused = !paused;
    btnPause.textContent = paused ? '재생' : '일시정지';
    btnPause.setAttribute('aria-pressed', paused ? 'true' : 'false');
    document.getElementById('runState').textContent = paused ? 'paused' : 'running';
    document.getElementById('dot').classList.toggle('paused', paused);
    document.getElementById('fpsLabel').textContent = paused ? '— fps' : (fpsShown||30)+' fps';
  });

  btnSnow.addEventListener('click', function(){
    var heavy = btnSnow.getAttribute('aria-pressed') !== 'true';
    btnSnow.setAttribute('aria-pressed', heavy ? 'true' : 'false');
    btnSnow.textContent = heavy ? '눈 보통' : '눈 많이';
    snowTarget = heavy ? 320 : 190;
    updateHud();
    showToast(heavy ? '눈을 많이 내려요' : '눈을 보통으로');
  });

  btnCopy.addEventListener('click', function(){
    var text = PY_SRC;
    function done(ok){ showToast(ok ? '코드를 복사했어요' : '복사에 실패했어요'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){done(true);}, function(){fallback();});
    } else fallback();
    function fallback(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta); done(ok);
      }catch(err){ done(false); }
    }
  });

  /* ================= python source + highlighter ================= */
  var PY_SRC = (function(){
    var b64 = document.getElementById('pysrc').textContent.trim();
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len), i;
    for(i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  })();

  var KW = {'import':1,'from':1,'def':1,'return':1,'for':1,'in':1,'if':1,'elif':1,
            'else':1,'while':1,'class':1,'and':1,'or':1,'not':1,'is':1,'None':1,
            'True':1,'False':1,'global':1,'break':1,'continue':1,'try':1,'except':1,
            'finally':1,'with':1,'as':1,'pass':1,'lambda':1,'yield':1,'raise':1,
            'del':1,'assert':1};
  var BI = {'print':1,'len':1,'int':1,'str':1,'float':1,'range':1,'max':1,'min':1,
            'abs':1,'round':1,'enumerate':1,'list':1,'dict':1,'set':1,'sorted':1,
            'zip':1,'open':1,'super':1,'isinstance':1};
  var TOKEN = /("(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)*')|(#[^\n]*)|(\b\d+\.?\d*\b)|([A-Za-z_]\w*)|([^\sA-Za-z0-9_#"'.,:;(){}\[\]+\-*/%<>=!&|^~]+)|(\s+)|([\s\S])/g;

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlight(line){
    var out = '', m, prevWord = '', cls;
    TOKEN.lastIndex = 0;
    while((m = TOKEN.exec(line)) !== null){
      var tok = m[0];
      if(m[1] || m[2]){ out += '<span class="tok-str">'+esc(tok)+'</span>'; prevWord = tok; }
      else if(m[3]){ out += '<span class="tok-com">'+esc(tok)+'</span>'; prevWord = '#'; }
      else if(m[4]){ out += '<span class="tok-num">'+esc(tok)+'</span>'; prevWord = tok; }
      else if(m[5]){
        cls = '';
        if(KW[tok]) cls = 'tok-kw';
        else if(prevWord === 'def' || prevWord === 'class') cls = 'tok-def';
        else if(BI[tok]) cls = 'tok-bi';
        out += cls ? '<span class="'+cls+'">'+esc(tok)+'</span>' : esc(tok);
        prevWord = tok;
      }
      else { out += esc(tok); if(tok.trim()) prevWord = tok; }
      if(m[0].length === 0) TOKEN.lastIndex++;
    }
    return out;
  }

  var lines = PY_SRC.split('\n');
  var lineEls = [];
  var codeEl = document.getElementById('code');
  (function renderCode(){
    var html = [], i;
    for(i=0;i<lines.length;i++){
      html.push('<div class="ln" id="ln'+i+'"><span class="n">'+(i+1)+'</span><span class="t">'
                + (highlight(lines[i]) || ' ') + '</span></div>');
    }
    codeEl.innerHTML = html.join('');
    for(i=0;i<lines.length;i++) lineEls.push(document.getElementById('ln'+i));
  })();

  /* fit code font so no line ever scrolls sideways */
  function fitCode(){
    var box = document.getElementById('codeScroll');
    var avail = box.clientWidth - 46;
    var maxLen = 0, i;
    for(i=0;i<lines.length;i++) if(lines[i].length > maxLen) maxLen = lines[i].length;
    var fs = Math.min(13.5, Math.max(8.2, avail/(maxLen*0.602)));
    codeEl.style.fontSize = fs.toFixed(2)+'px';
  }

  /* active line follows the render() body, like a live trace */
  var hot = [];
  (function findHot(){
    var s = -1, e = -1, i;
    for(i=0;i<lines.length;i++){
      if(s < 0 && lines[i].indexOf('def render') === 0) s = i;
      if(s >= 0 && lines[i].indexOf('    return ch, co') === 0){ e = i; break; }
    }
    if(s < 0){ s = 0; e = Math.min(lines.length-1, 40); }
    for(i=s;i<=e;i++) if(lines[i].trim()) hot.push(i);
  })();

  var hotIdx = 0, lastHot = 0;
  function tickActive(ts){
    requestAnimationFrame(tickActive);
    if(paused) return;
    if(ts - lastHot < 150) return;
    lastHot = ts;
    if(!hot.length) return;
    var prev = lineEls[hot[(hotIdx + hot.length - 1) % hot.length]];
    if(prev) prev.classList.remove('active');
    var idx = hot[hotIdx % hot.length];
    var el = lineEls[idx];
    if(el){
      el.classList.add('active');
      var box = document.getElementById('codeScroll');
      var top = el.offsetTop - box.clientHeight*0.42;
      box.scrollTop = Math.max(0, top);
    }
    hotIdx++;
  }

  /* ================= boot ================= */
  layout();
  fitCode();
  window.addEventListener('resize', function(){
    layout(); fitCode();
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ layout(); fitCode(); }, 220);
  });

  snowCount = snowTarget;
  var snowRamp = 0;
  (function snowGrow(){
    if(snowCount < snowTarget){ snowCount += 4; if(snowCount > snowTarget) snowCount = snowTarget; }
    if(snowCount > snowTarget){ snowCount -= 8; if(snowCount < snowTarget) snowCount = snowTarget; }
    requestAnimationFrame(snowGrow);
  })();

  updateHud();
  requestAnimationFrame(step);
  requestAnimationFrame(tickActive);
  setTimeout(function(){ document.getElementById('hint').classList.add('off'); }, 6000);

  /* surface runtime errors (also useful for automated checks) */
  window.__errors = [];
  window.addEventListener('error', function(e){
    window.__errors.push(String(e.message || e.error));
    var d = document.getElementById('errbox');
    if(!d){
      d = document.createElement('div');
      d.id = 'errbox';
      d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;background:#400;color:#fff;font:11px monospace;padding:4px 8px;max-width:100%;white-space:pre-wrap';
      document.body.appendChild(d);
    }
    d.textContent = 'JS ERROR: ' + (e.message || e.error);
  });
  window.addEventListener('unhandledrejection', function(e){
    window.__errors.push('promise: ' + e.reason);
  });
  window.__ready = true;
  window.__asciiTree = {
    state: function(){ return {cols:cols, rows:rows, paused:paused, snow:snowCount, fps:fpsShown,
                               leaves:(LEAF.length/7)|0, bulbs:(BULBS.length/8)|0}; },
    yaw: function(){ return yaw; },
    grid: function(){
      var out = [], rr, cc, k;
      for(rr=0;rr<rows;rr++){
        k = '';
        for(cc=0;cc<cols;cc++){ var v = chBuf[rr*cols+cc]; k += (v<0?' ':CHARS.charAt(v)); }
        out.push(k);
      }
      return out.join('\n');
    }
  };
})();
</script>
</body>
